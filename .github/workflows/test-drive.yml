name: Test Drive Download

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Lien Google Drive"
        required: true

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Install jq
        run: |
          sudo apt update
          sudo apt install -y jq

      - name: Extract File ID
        id: drive
        run: |

          URL="${{ github.event.inputs.drive_url }}"

          FILE_ID=$(echo "$URL" | sed -n 's#.*\/d\/\([^/]*\).*#\1#p')

          echo "file_id=$FILE_ID" >> $GITHUB_OUTPUT

      - name: Get Access Token
        id: token
        run: |

          ACCESS_TOKEN=$(curl -s \
            -X POST \
            https://oauth2.googleapis.com/token \
            -d client_id="${{ secrets.GOOGLE_CLIENT_ID }}" \
            -d client_secret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            -d refresh_token="${{ secrets.GOOGLE_REFRESH_TOKEN }}" \
            -d grant_type=refresh_token \
            | jq -r '.access_token')

          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Download File
        run: |

          curl -L \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            "https://www.googleapis.com/drive/v3/files/${{ steps.drive.outputs.file_id }}?alt=media" \
            -o downloaded.tar.xz

      - name: Verify
        run: |
          ls -lh
          file downloaded.tar.xz
