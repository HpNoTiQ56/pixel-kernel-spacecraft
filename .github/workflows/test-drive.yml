name: Download latest Kernel Sources

on:
  workflow_dispatch:
    inputs:
      drive_folder_url:
        description: "Lien du dossier Google Drive partagé par Xin LI contenant kernels-*.tar.xz"
        required: true
        type: string

jobs:
  download-and-extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y jq curl xz-utils

      - name: Extract folder ID
        id: folder
        shell: bash
        env:
          DRIVE_FOLDER_URL: ${{ inputs.drive_folder_url }}
        run: |
          set -euo pipefail

          FOLDER_ID="$(
            printf '%s' "$DRIVE_FOLDER_URL" |
            sed -nE 's#.*(/folders/|[?&]id=)([^/?&]+).*#\2#p'
          )"

          if [ -z "$FOLDER_ID" ]; then
            echo "::error::Impossible d'extraire l'ID du dossier depuis cette URL."
            exit 1
          fi

          echo "folder_id=$FOLDER_ID" >> "$GITHUB_OUTPUT"
          echo "Dossier Drive détecté : $FOLDER_ID"

      - name: Get Google access token
        id: auth
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl --silent --show-error --fail-with-body \
              --request POST \
              --data-urlencode "client_id=$GOOGLE_CLIENT_ID" \
              --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" \
              --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN" \
              --data-urlencode "grant_type=refresh_token" \
              "https://oauth2.googleapis.com/token"
          )"

          ACCESS_TOKEN="$(jq -r '.access_token // empty' <<< "$RESPONSE")"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Google n'a retourné aucun access_token."
            jq -c 'del(.access_token)' <<< "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Find latest kernels archive
        id: kernel
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FOLDER_ID: ${{ steps.folder.outputs.folder_id }}
        run: |
          set -euo pipefail

          QUERY="'${FOLDER_ID}' in parents and trashed = false and name contains 'kernels-'"

          RESPONSE="$(
            curl --silent --show-error --fail-with-body \
              --get \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              --data-urlencode "q=$QUERY" \
              --data-urlencode "orderBy=modifiedTime desc" \
              --data-urlencode "pageSize=100" \
              --data-urlencode "fields=files(id,name,size,modifiedTime,mimeType)" \
              "https://www.googleapis.com/drive/v3/files"
          )"

          FILE="$(
            jq -c '
              [
                .files[]
                | select(.name | test("^kernels-.*\\.tar\\.xz$"))
              ]
              | sort_by(.modifiedTime)
              | reverse
              | .[0] // empty
            ' <<< "$RESPONSE"
          )"

          if [ -z "$FILE" ]; then
            echo "::error::Aucun fichier kernels-*.tar.xz trouvé dans le dossier."
            echo "Contenu retourné par Drive :"
            jq -r '.files[]? | "\(.modifiedTime)  \(.name)"' <<< "$RESPONSE"
            exit 1
          fi

          FILE_ID="$(jq -r '.id' <<< "$FILE")"
          FILE_NAME="$(jq -r '.name' <<< "$FILE")"
          FILE_SIZE="$(jq -r '.size // "inconnue"' <<< "$FILE")"
          MODIFIED_TIME="$(jq -r '.modifiedTime' <<< "$FILE")"

          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

          {
            echo "### Archive Drive sélectionnée"
            echo
            echo "- Nom : \`$FILE_NAME\`"
            echo "- Taille : \`$FILE_SIZE octets\`"
            echo "- Modification : \`$MODIFIED_TIME\`"
            echo "- ID : \`$FILE_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Archive sélectionnée : $FILE_NAME"
          echo "Dernière modification : $MODIFIED_TIME"
          echo "Taille annoncée : $FILE_SIZE octets"

      - name: Check runner disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Espace disque avant téléchargement ==="
          df -h .
          echo
          echo "=== Mémoire ==="
          free -h

      - name: Download latest kernel archive
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FILE_ID: ${{ steps.kernel.outputs.file_id }}
          FILE_NAME: ${{ steps.kernel.outputs.file_name }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media" \
            --output "$FILE_NAME"

          test -s "$FILE_NAME"

          echo "=== Archive téléchargée ==="
          ls -lh "$FILE_NAME"
          file "$FILE_NAME"

          echo "=== Test d'intégrité XZ ==="
          xz --test "$FILE_NAME"

      - name: Extract kernel sources
        id: extract
        shell: bash
        env:
          FILE_NAME: ${{ steps.kernel.outputs.file_name }}
        run: |
          set -euo pipefail

          mkdir -p workspace

          tar \
            --extract \
            --file "$FILE_NAME" \
            --directory workspace

          echo "source_dir=$GITHUB_WORKSPACE/workspace" >> "$GITHUB_OUTPUT"

          echo "Extraction terminée dans :"
          echo "$GITHUB_WORKSPACE/workspace"

      - name: Inspect extracted sources
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Espace disque après extraction ==="
          df -h .
          echo

          echo "=== Racine du workspace ==="
          ls -lah workspace
          echo

          echo "=== Arborescence niveau 1 ==="
          find workspace \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%y  %p\n' \
            | sort
          echo

          echo "=== Arborescence niveau 2 ==="
          find workspace \
            -mindepth 1 \
            -maxdepth 2 \
            -printf '%y  %p\n' \
            | sort \
            | head -n 250
          echo

          echo "=== Taille des éléments principaux ==="
          du -sh workspace/* 2>/dev/null | sort -h || true
          echo

          echo "=== Points de repère kernel ==="
          find workspace \
            -maxdepth 5 \
            \( \
              -name BUILD.bazel \
              -o -name WORKSPACE \
              -o -name MODULE.bazel \
              -o -name build.config \
              -o -name build.config.gki.aarch64 \
              -o -name Makefile \
            \) \
            -print \
            | sort \
            | head -n 250
