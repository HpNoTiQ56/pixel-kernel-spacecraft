name: Build OTA + Publish Custota

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID Build Kernel (vide = dernier succès)"
        required: false
        type: string

  workflow_run:
    workflows:
      - "Build Kernel"
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: custota-publish
  cancel-in-progress: false

jobs:
  ota-release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on:
      - self-hosted
      - Linux
      - X64
      - android-worker

    timeout-minutes: 120

    env:
      WORKSPACE: /home/aurelien/workspace
      OTA_MOUNT: /mnt/ota
      OTA_PUBLIC_BASE_URL: https://ota.bdxbnb.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner and OTA mount
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Runner ==="
          hostname
          whoami

          echo
          echo "=== Point de montage OTA ==="

          if ! mountpoint -q "$OTA_MOUNT"; then
            echo "::error::$OTA_MOUNT n'est pas un point de montage actif"
            exit 1
          fi

          if [ ! -d "$OTA_MOUNT" ]; then
            echo "::error::Répertoire absent : $OTA_MOUNT"
            exit 1
          fi

          if [ ! -w "$OTA_MOUNT" ]; then
            echo "::error::$OTA_MOUNT n'est pas accessible en écriture"
            ls -ld "$OTA_MOUNT"
            id
            exit 1
          fi

          df -h "$OTA_MOUNT"
          findmnt "$OTA_MOUNT" || true
          ls -lah "$OTA_MOUNT"

          echo
          echo "=== Test d'écriture ==="

          TEST_FILE="$OTA_MOUNT/.github-actions-write-test-$$"

          printf 'test\n' > "$TEST_FILE"
          test -s "$TEST_FILE"
          rm -f "$TEST_FILE"

          echo "Montage OTA opérationnel."

      - name: Cleanup workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORKSPACE/release"
          rm -rf "$WORKSPACE/custota"
          rm -rf "$WORKSPACE/ota"

          mkdir -p "$WORKSPACE/release"
          mkdir -p "$WORKSPACE/custota"
          mkdir -p "$WORKSPACE/ota"

      - name: Download artifact from triggering run
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: kernel-build
          path: ${{ env.WORKSPACE }}/custota

      - name: Download artifact from specific run
        if: github.event_name == 'workflow_dispatch' && inputs.run_id != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ inputs.run_id }}
          name: kernel-build
          path: ${{ env.WORKSPACE }}/custota

      - name: Download latest successful artifact
        if: github.event_name == 'workflow_dispatch' && inputs.run_id == ''
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile_pixel_susfs.yml
          workflow_conclusion: success
          branch: main
          name: kernel-build
          path: ${{ env.WORKSPACE }}/custota

      - name: Locate files
        id: files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Contenu de l'artifact ==="

          find "$WORKSPACE/custota" \
            -maxdepth 4 \
            -type f \
            -printf '%p\n' \
            | sort

          BOOT_IMG="$(
            find "$WORKSPACE/custota" \
              -type f \
              -name '*_boot_KSUNext_*_SUSFS_*.img' \
              -print \
              -quit
          )"

          META_JSON="$(
            find "$WORKSPACE/custota" \
              -type f \
              -name 'build-metadata.json' \
              -print \
              -quit
          )"

          if [ -z "$BOOT_IMG" ] || [ ! -s "$BOOT_IMG" ]; then
            echo "::error::Boot patché introuvable dans l'artifact"
            exit 1
          fi

          if [ -z "$META_JSON" ] || [ ! -s "$META_JSON" ]; then
            echo "::error::build-metadata.json introuvable dans l'artifact"
            exit 1
          fi

          jq empty "$META_JSON"

          echo "BOOT_IMG=$BOOT_IMG"
          echo "META_JSON=$META_JSON"

          echo "boot_img=$BOOT_IMG" >> "$GITHUB_OUTPUT"
          echo "meta_json=$META_JSON" >> "$GITHUB_OUTPUT"

      - name: Read metadata and detect device
        id: meta
        shell: bash
        env:
          META_JSON: ${{ steps.files.outputs.meta_json }}
        run: |
          set -euo pipefail

          OTA_URL="$(jq -er '.ota_url' "$META_JSON")"
          SPL="$(jq -er '.spl' "$META_JSON")"
          KSU_VERSION="$(jq -er '.ksu_version' "$META_JSON")"
          SUSFS_VERSION="$(jq -er '.susfs_version' "$META_JSON")"
          BUILD_REVISION="$(jq -er '.build_revision' "$META_JSON")"
          STOCK_VERSION_CODE="$(jq -r '.version_code // empty' "$META_JSON")"
          BOOT_FILENAME="$(jq -er '.boot_filename' "$META_JSON")"

          #
          # Retrait de la query string, par exemple ?hl=fr.
          #
          OTA_URL_NO_QUERY="${OTA_URL%%\?*}"
          OTA_FILENAME="${OTA_URL_NO_QUERY##*/}"

          #
          # Exemple :
          # grizzly-ota-cd1a.260905.001.b1-e2698032.zip
          # devient :
          # grizzly
          #
          case "$OTA_FILENAME" in
            *-ota-*.zip)
              DEVICE="${OTA_FILENAME%%-ota-*}"
              ;;
            *)
              echo "::error::Nom OTA non reconnu : $OTA_FILENAME"
              echo "Format attendu : <device>-ota-<build>.zip"
              exit 1
              ;;
          esac

          if ! printf '%s' "$DEVICE" | grep -Eq '^[a-z0-9_-]+$'; then
            echo "::error::Codename OTA invalide : $DEVICE"
            exit 1
          fi

          if ! printf '%s' "$BUILD_REVISION" | grep -Eq '^[0-9]{12}$'; then
            echo "::error::build_revision invalide : $BUILD_REVISION"
            echo "Format attendu : YYYYMMDDHHMM"
            exit 1
          fi

          #
          # Le versionCode Custota est uniquement basé sur la date du build.
          # Il reste numérique et augmente à chaque nouvelle publication.
          #
          CUSTOTA_VERSION_CODE="$BUILD_REVISION"

          #
          # Nom lisible de la version publiée.
          #
          RELEASE_VERSION="${SPL}-r${BUILD_REVISION}"

          {
            echo "ota_url=$OTA_URL"
            echo "ota_filename=$OTA_FILENAME"
            echo "device=$DEVICE"
            echo "spl=$SPL"
            echo "ksu_version=$KSU_VERSION"
            echo "susfs_version=$SUSFS_VERSION"
            echo "build_revision=$BUILD_REVISION"
            echo "stock_version_code=$STOCK_VERSION_CODE"
            echo "boot_filename=$BOOT_FILENAME"
            echo "custota_version_code=$CUSTOTA_VERSION_CODE"
            echo "release_version=$RELEASE_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "=== Métadonnées du build ==="
          echo "DEVICE=$DEVICE"
          echo "OTA_FILENAME=$OTA_FILENAME"
          echo "SPL=$SPL"
          echo "KSU_VERSION=$KSU_VERSION"
          echo "SUSFS_VERSION=$SUSFS_VERSION"
          echo "BUILD_REVISION=$BUILD_REVISION"
          echo "CUSTOTA_VERSION_CODE=$CUSTOTA_VERSION_CODE"
          echo "RELEASE_VERSION=$RELEASE_VERSION"

          {
            echo "### Publication Custota"
            echo
            echo "- Appareil : \`$DEVICE\`"
            echo "- OTA source : \`$OTA_FILENAME\`"
            echo "- SPL : \`$SPL\`"
            echo "- KernelSU Next : \`$KSU_VERSION\`"
            echo "- SUSFS : \`$SUSFS_VERSION\`"
            echo "- Version : \`$RELEASE_VERSION\`"
            echo "- VersionCode : \`$CUSTOTA_VERSION_CODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify boot artifact
        shell: bash
        env:
          BOOT_IMG: ${{ steps.files.outputs.boot_img }}
        run: |
          set -euo pipefail

          echo "=== Boot sélectionné ==="

          ls -lh "$BOOT_IMG"
          file "$BOOT_IMG"
          sha256sum "$BOOT_IMG"

          echo
          echo "=== Linux version ==="

          LINUX_VERSION="$(
            strings "$BOOT_IMG" \
              | grep -a -m1 'Linux version'
          )"

          if [ -z "$LINUX_VERSION" ]; then
            echo "::error::Linux version introuvable dans le boot"
            exit 1
          fi

          echo "$LINUX_VERSION"

          echo
          echo "=== PREEMPT ==="

          strings "$BOOT_IMG" \
            | grep -a -m5 'PREEMPT' \
            || true

      - name: Download stock OTA
        shell: bash
        env:
          OTA_URL: ${{ steps.meta.outputs.ota_url }}
        run: |
          set -euo pipefail

          STOCK_OTA="$WORKSPACE/ota/stock.zip"
          TEMP_OTA="$WORKSPACE/ota/stock.zip.part"

          rm -f "$STOCK_OTA" "$TEMP_OTA"

          echo "=== Téléchargement OTA source ==="
          echo "$OTA_URL"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --continue-at - \
            --output "$TEMP_OTA" \
            "$OTA_URL"

          test -s "$TEMP_OTA"

          mv "$TEMP_OTA" "$STOCK_OTA"

          echo
          echo "=== OTA téléchargée ==="

          ls -lh "$STOCK_OTA"
          file "$STOCK_OTA"
          sha256sum "$STOCK_OTA"

          echo
          echo "=== Validation ZIP ==="

          unzip -tq "$STOCK_OTA"

      - name: Validate OTA device metadata
        id: otadevice
        shell: bash
        env:
          EXPECTED_DEVICE: ${{ steps.meta.outputs.device }}
        run: |
          set -euo pipefail

          STOCK_OTA="$WORKSPACE/ota/stock.zip"
          OTA_METADATA="$WORKSPACE/ota/metadata.txt"

          echo "=== Métadonnées OTA source ==="

          unzip -p \
            "$STOCK_OTA" \
            META-INF/com/android/metadata \
            > "$OTA_METADATA"

          if [ ! -s "$OTA_METADATA" ]; then
            echo "::error::META-INF/com/android/metadata absent ou vide"
            exit 1
          fi

          cat "$OTA_METADATA"

          PRE_DEVICE="$(
            sed -n 's/^pre-device=//p' "$OTA_METADATA" \
              | head -n 1
          )"

          POST_DEVICE="$(
            sed -n 's/^post-device=//p' "$OTA_METADATA" \
              | head -n 1
          )"

          if [ -z "$PRE_DEVICE" ]; then
            echo "::error::pre-device absent des métadonnées OTA"
            exit 1
          fi

          device_list_contains() {
            local device_list="$1"
            local expected_device="$2"

            printf '%s\n' "$device_list" \
              | tr '|,' '\n\n' \
              | sed '/^$/d' \
              | grep -Fqx -- "$expected_device"
          }

          if ! device_list_contains "$PRE_DEVICE" "$EXPECTED_DEVICE"; then
            echo "::error::OTA conçue pour '$PRE_DEVICE', codename URL attendu '$EXPECTED_DEVICE'"
            exit 1
          fi

          if [ -n "$POST_DEVICE" ] &&
             ! device_list_contains "$POST_DEVICE" "$EXPECTED_DEVICE"; then
            echo "::error::post-device='$POST_DEVICE', appareil attendu='$EXPECTED_DEVICE'"
            exit 1
          fi

          echo
          echo "=== Appareil validé ==="
          echo "EXPECTED_DEVICE=$EXPECTED_DEVICE"
          echo "PRE_DEVICE=$PRE_DEVICE"
          echo "POST_DEVICE=$POST_DEVICE"

          echo "pre_device=$PRE_DEVICE" >> "$GITHUB_OUTPUT"
          echo "post_device=$POST_DEVICE" >> "$GITHUB_OUTPUT"

      - name: Restore signing keys
        shell: bash
        env:
          AVB_KEY_B64: ${{ secrets.AVB_KEY_B64 }}
          OTA_KEY_B64: ${{ secrets.OTA_KEY_B64 }}
          OTA_CRT_B64: ${{ secrets.OTA_CRT_B64 }}
          AVB_PASS: ${{ secrets.AVB_PASS }}
          OTA_PASS: ${{ secrets.OTA_PASS }}
        run: |
          set -euo pipefail

          KEYS_DIR="$WORKSPACE/keys"

          rm -rf "$KEYS_DIR"
          mkdir -p "$KEYS_DIR"

          printf '%s' "$AVB_KEY_B64" \
            | base64 -d \
            > "$KEYS_DIR/avb.key"

          printf '%s' "$OTA_KEY_B64" \
            | base64 -d \
            > "$KEYS_DIR/ota.key"

          printf '%s' "$OTA_CRT_B64" \
            | base64 -d \
            > "$KEYS_DIR/ota.crt"

          printf '%s' "$AVB_PASS" \
            > "$KEYS_DIR/avb.pass"

          printf '%s' "$OTA_PASS" \
            > "$KEYS_DIR/ota.pass"

          chmod 600 "$KEYS_DIR/"*

          test -s "$KEYS_DIR/avb.key"
          test -s "$KEYS_DIR/ota.key"
          test -s "$KEYS_DIR/ota.crt"
          test -s "$KEYS_DIR/avb.pass"
          test -s "$KEYS_DIR/ota.pass"

      - name: Install avbroot
        shell: bash
        env:
          AVBROOT_VERSION: "3.34.1"
        run: |
          set -euo pipefail

          TOOLS_DIR="$WORKSPACE/tools"
          AVBROOT_BIN="$TOOLS_DIR/avbroot"
          AVBROOT_ZIP="$TOOLS_DIR/avbroot.zip"

          mkdir -p "$TOOLS_DIR"

          if [ -x "$AVBROOT_BIN" ]; then
            echo "=== avbroot déjà installé ==="
            "$AVBROOT_BIN" --version
            exit 0
          fi

          ARCH="$(uname -m)"

          case "$ARCH" in
            x86_64)
              TARGET="x86_64-unknown-linux-gnu"
              ;;
            aarch64|arm64)
              TARGET="aarch64-unknown-linux-gnu"
              ;;
            *)
              echo "::error::Architecture non supportée : $ARCH"
              exit 1
              ;;
          esac

          DOWNLOAD_URL="https://github.com/chenxiaolong/avbroot/releases/download/v${AVBROOT_VERSION}/avbroot-${AVBROOT_VERSION}-${TARGET}.zip"

          echo "=== Téléchargement avbroot ==="
          echo "Version : $AVBROOT_VERSION"
          echo "Cible   : $TARGET"

          rm -f "$AVBROOT_ZIP"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --show-error \
            "$DOWNLOAD_URL" \
            --output "$AVBROOT_ZIP"

          unzip -tq "$AVBROOT_ZIP"

          rm -f "$AVBROOT_BIN"

          unzip -o \
            "$AVBROOT_ZIP" \
            -d "$TOOLS_DIR"

          if [ ! -f "$AVBROOT_BIN" ]; then
            echo "::error::Binaire avbroot introuvable après extraction"

            find "$TOOLS_DIR" \
              -maxdepth 3 \
              -type f \
              -printf '%p\n' \
              | sort

            exit 1
          fi

          chmod 700 "$AVBROOT_BIN"

          "$AVBROOT_BIN" --version

      - name: Patch and sign OTA
        shell: bash
        env:
          BOOT_IMG: ${{ steps.files.outputs.boot_img }}
        run: |
          set -euo pipefail

          STOCK_OTA="$WORKSPACE/ota/stock.zip"
          OUTPUT_OTA="$WORKSPACE/release/ota-signed.zip"

          test -s "$STOCK_OTA"
          test -s "$BOOT_IMG"

          rm -f "$OUTPUT_OTA"

          echo "=== Boot utilisé par avbroot ==="

          sha256sum "$BOOT_IMG"

          strings "$BOOT_IMG" \
            | grep -a -m1 'Linux version'

          echo
          echo "=== Patch et signature OTA ==="

          "$WORKSPACE/tools/avbroot" ota patch \
            --input "$STOCK_OTA" \
            --output "$OUTPUT_OTA" \
            --key-avb "$WORKSPACE/keys/avb.key" \
            --key-ota "$WORKSPACE/keys/ota.key" \
            --cert-ota "$WORKSPACE/keys/ota.crt" \
            --pass-avb-file "$WORKSPACE/keys/avb.pass" \
            --pass-ota-file "$WORKSPACE/keys/ota.pass" \
            --prepatched "$BOOT_IMG"

          test -s "$OUTPUT_OTA"

          echo
          echo "=== OTA signée ==="

          ls -lh "$OUTPUT_OTA"
          file "$OUTPUT_OTA"

      - name: Verify signed OTA device metadata
        shell: bash
        env:
          EXPECTED_DEVICE: ${{ steps.meta.outputs.device }}
        run: |
          set -euo pipefail

          OUTPUT_OTA="$WORKSPACE/release/ota-signed.zip"
          SIGNED_METADATA="$WORKSPACE/release/signed-metadata.txt"

          unzip -tq "$OUTPUT_OTA"

          unzip -p \
            "$OUTPUT_OTA" \
            META-INF/com/android/metadata \
            > "$SIGNED_METADATA"

          test -s "$SIGNED_METADATA"

          echo "=== Métadonnées OTA signée ==="

          cat "$SIGNED_METADATA"

          PRE_DEVICE="$(
            sed -n 's/^pre-device=//p' "$SIGNED_METADATA" \
              | head -n 1
          )"

          if [ -z "$PRE_DEVICE" ]; then
            echo "::error::pre-device absent de l'OTA signée"
            exit 1
          fi

          if ! printf '%s\n' "$PRE_DEVICE" \
            | tr '|,' '\n\n' \
            | sed '/^$/d' \
            | grep -Fqx -- "$EXPECTED_DEVICE"
          then
            echo "::error::OTA signée pour '$PRE_DEVICE', attendu '$EXPECTED_DEVICE'"
            exit 1
          fi

          echo
          echo "OTA signée validée pour $EXPECTED_DEVICE."

      - name: Verify boot embedded in signed OTA
        shell: bash
        env:
          SOURCE_BOOT: ${{ steps.files.outputs.boot_img }}
        run: |
          set -euo pipefail

          VERIFY_DIR="$WORKSPACE/release/verify"

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          cd "$VERIFY_DIR"

          "$WORKSPACE/tools/avbroot" ota extract \
            --input "$WORKSPACE/release/ota-signed.zip"

          if [ ! -s boot.img ]; then
            echo "::error::boot.img absent après extraction de l'OTA signée"
            exit 1
          fi

          echo "=== Boot source ==="

          sha256sum "$SOURCE_BOOT"

          strings "$SOURCE_BOOT" \
            | grep -a -m1 'Linux version'

          echo
          echo "=== Boot extrait de l'OTA ==="

          sha256sum boot.img

          strings boot.img \
            | grep -a -m1 'Linux version'

          echo
          echo "=== PREEMPT OTA ==="

          strings boot.img \
            | grep -a -m5 'PREEMPT' \
            || true

      - name: Generate signed OTA SHA256
        id: sha
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_OTA="$WORKSPACE/release/ota-signed.zip"

          SHA256="$(
            sha256sum "$OUTPUT_OTA" \
              | awk '{print $1}'
          )"

          if ! printf '%s' "$SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::SHA-256 invalide : $SHA256"
            exit 1
          fi

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "OTA_SHA256=$SHA256"

      - name: Generate Custota JSON
        id: custota
        shell: bash
        env:
          DEVICE: ${{ steps.meta.outputs.device }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
          VERSION_CODE: ${{ steps.meta.outputs.custota_version_code }}
          BUILD_REVISION: ${{ steps.meta.outputs.build_revision }}
          KSU_VERSION: ${{ steps.meta.outputs.ksu_version }}
          SUSFS_VERSION: ${{ steps.meta.outputs.susfs_version }}
          SPL: ${{ steps.meta.outputs.spl }}
          OTA_SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail

          JSON_FILE="$WORKSPACE/release/${DEVICE}.json"

          ZIP_URL="${OTA_PUBLIC_BASE_URL}/${DEVICE}/${BUILD_REVISION}/ota-signed.zip"

          CHANGELOG="KernelSU Next ${KSU_VERSION} + SUSFS ${SUSFS_VERSION} - SPL ${SPL}"

          jq -n \
            --arg version "$RELEASE_VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --arg zipUrl "$ZIP_URL" \
            --arg zipSha256 "$OTA_SHA256" \
            --arg changelog "$CHANGELOG" \
            '{
              version: $version,
              versionCode: $versionCode,
              zipUrl: $zipUrl,
              zipSha256: $zipSha256,
              changelog: $changelog
            }' \
            > "$JSON_FILE"

          jq empty "$JSON_FILE"

          echo "=== JSON Custota ==="

          cat "$JSON_FILE"

          echo "json_file=$JSON_FILE" >> "$GITHUB_OUTPUT"
          echo "zip_url=$ZIP_URL" >> "$GITHUB_OUTPUT"      - name: Install Custota Tool
        shell: bash
        env:
          CUSTOTA_VERSION: "6.6"
        run: |
          set -euo pipefail

          TOOLS_DIR="$WORKSPACE/tools"
          CUSTOTA_BIN="$TOOLS_DIR/custota-tool"
          CUSTOTA_ZIP="$TOOLS_DIR/custota-tool.zip"
          EXTRACT_DIR="$TOOLS_DIR/custota-tool-extract"

          mkdir -p "$TOOLS_DIR"

          if [ -x "$CUSTOTA_BIN" ]; then
            INSTALLED_VERSION="$(
              "$CUSTOTA_BIN" --version 2>/dev/null || true
            )"

            echo "Version installée : $INSTALLED_VERSION"

            if printf '%s' "$INSTALLED_VERSION" |
              grep -Fq "$CUSTOTA_VERSION"
            then
              echo "custota-tool $CUSTOTA_VERSION déjà installé."
              exit 0
            fi

            echo "Version différente détectée, réinstallation."
            rm -f "$CUSTOTA_BIN"
          fi

          ARCH="$(uname -m)"

          case "$ARCH" in
            x86_64)
              TARGET="x86_64-unknown-linux-gnu"
              ;;
            aarch64|arm64)
              TARGET="aarch64-unknown-linux-gnu"
              ;;
            *)
              echo "::error::Architecture non supportée : $ARCH"
              exit 1
              ;;
          esac

          ARCHIVE_NAME="custota-tool-${CUSTOTA_VERSION}-${TARGET}.zip"

          DOWNLOAD_URL="https://github.com/chenxiaolong/Custota/releases/download/v${CUSTOTA_VERSION}/${ARCHIVE_NAME}"

          echo "=== Installation custota-tool ==="
          echo "Version : $CUSTOTA_VERSION"
          echo "Cible   : $TARGET"
          echo "Archive : $ARCHIVE_NAME"

          rm -f "$CUSTOTA_ZIP"
          rm -rf "$EXTRACT_DIR"

          mkdir -p "$EXTRACT_DIR"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --show-error \
            "$DOWNLOAD_URL" \
            --output "$CUSTOTA_ZIP"

          echo
          echo "=== Archive téléchargée ==="

          ls -lh "$CUSTOTA_ZIP"
          file "$CUSTOTA_ZIP"

          unzip -tq "$CUSTOTA_ZIP"

          unzip -o \
            "$CUSTOTA_ZIP" \
            -d "$EXTRACT_DIR"

          CUSTOTA_FOUND="$(
            find "$EXTRACT_DIR" \
              -type f \
              -name 'custota-tool' \
              -print \
              -quit
          )"

          if [ -z "$CUSTOTA_FOUND" ]; then
            echo "::error::Binaire custota-tool introuvable dans l'archive"

            find "$EXTRACT_DIR" \
              -maxdepth 4 \
              -type f \
              -printf '%p\n' \
              | sort

            exit 1
          fi

          cp "$CUSTOTA_FOUND" "$CUSTOTA_BIN"

          chmod 700 "$CUSTOTA_BIN"

          rm -rf "$EXTRACT_DIR"
          rm -f "$CUSTOTA_ZIP"

          echo
          echo "=== Version installée ==="

          "$CUSTOTA_BIN" --version

          echo
          echo "=== Commandes disponibles ==="

          "$CUSTOTA_BIN" --help

      - name: Prepare OTA signing key for Custota
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_KEY="$WORKSPACE/keys/ota.key"
          PASSPHRASE_FILE="$WORKSPACE/keys/ota.pass"
          CUSTOTA_KEY="$WORKSPACE/keys/ota-custota.key"

          test -s "$SOURCE_KEY"
          test -s "$PASSPHRASE_FILE"

          rm -f "$CUSTOTA_KEY"

          echo "=== Préparation de la clé pour custota-tool ==="

          #
          # custota-tool peut demander interactivement la passphrase.
          # Pour éviter toute interaction dans GitHub Actions, on crée une
          # copie temporaire non chiffrée de la clé privée.
          #
          openssl pkey \
            -in "$SOURCE_KEY" \
            -passin "file:$PASSPHRASE_FILE" \
            -out "$CUSTOTA_KEY"

          chmod 600 "$CUSTOTA_KEY"

          test -s "$CUSTOTA_KEY"

          echo
          echo "=== Vérification de la clé ==="

          openssl pkey \
            -in "$CUSTOTA_KEY" \
            -check \
            -noout

          echo "Clé temporaire Custota prête."

      - name: Generate Custota csig and update info
        id: custota
        shell: bash
        env:
          DEVICE: ${{ steps.meta.outputs.device }}
          BUILD_REVISION: ${{ steps.meta.outputs.build_revision }}
        run: |
          set -euo pipefail

          CUSTOTA_BIN="$WORKSPACE/tools/custota-tool"
          OTA_FILE="$WORKSPACE/release/ota-signed.zip"

          CUSTOTA_DIR="$WORKSPACE/release/custota"
          CSIG_FILE="$CUSTOTA_DIR/ota-signed.zip.csig"
          JSON_FILE="$CUSTOTA_DIR/${DEVICE}.json"

          CUSTOTA_KEY="$WORKSPACE/keys/ota-custota.key"
          OTA_CERT="$WORKSPACE/keys/ota.crt"

          test -x "$CUSTOTA_BIN"
          test -s "$OTA_FILE"
          test -s "$CUSTOTA_KEY"
          test -s "$OTA_CERT"

          rm -rf "$CUSTOTA_DIR"
          mkdir -p "$CUSTOTA_DIR"

          echo "=== Génération du fichier CSIG ==="

          "$CUSTOTA_BIN" gen-csig \
            --input "$OTA_FILE" \
            --output "$CSIG_FILE" \
            --key "$CUSTOTA_KEY" \
            --cert "$OTA_CERT"

          if [ ! -s "$CSIG_FILE" ]; then
            echo "::error::Le fichier CSIG n'a pas été généré"
            exit 1
          fi

          echo
          echo "=== CSIG généré ==="

          ls -lh "$CSIG_FILE"
          file "$CSIG_FILE"

          echo
          echo "=== Inspection du CSIG ==="

          "$CUSTOTA_BIN" show-csig \
            --input "$CSIG_FILE"

          echo
          echo "=== Génération du JSON officiel Custota ==="

          #
          # Le JSON se trouve à la racine :
          #
          # /grizzly.json
          #
          # et pointe vers :
          #
          # /grizzly/<revision>/ota-signed.zip
          #
          # custota-tool déduira par défaut que le CSIG se trouve à :
          #
          # /grizzly/<revision>/ota-signed.zip.csig
          #
          LOCATION="${DEVICE}/${BUILD_REVISION}/ota-signed.zip"

          "$CUSTOTA_BIN" gen-update-info \
            --file "$JSON_FILE" \
            --location "$LOCATION"

          if [ ! -s "$JSON_FILE" ]; then
            echo "::error::Le JSON Custota n'a pas été généré"
            exit 1
          fi

          echo
          echo "=== JSON Custota officiel ==="

          jq . "$JSON_FILE"

          echo
          echo "=== Fichiers Custota ==="

          ls -lh \
            "$CSIG_FILE" \
            "$JSON_FILE"

          {
            echo "csig_file=$CSIG_FILE"
            echo "json_file=$JSON_FILE"
            echo "location=$LOCATION"
          } >> "$GITHUB_OUTPUT"

      - name: Publish versioned OTA to Unraid
        shell: bash
        env:
          DEVICE: ${{ steps.meta.outputs.device }}
          BUILD_REVISION: ${{ steps.meta.outputs.build_revision }}
          BOOT_IMG: ${{ steps.files.outputs.boot_img }}
          JSON_FILE: ${{ steps.custota.outputs.json_file }}
          CSIG_FILE: ${{ steps.custota.outputs.csig_file }}
          EXPECTED_SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail

          SOURCE_OTA="$WORKSPACE/release/ota-signed.zip"

          DEVICE_DIR="$OTA_MOUNT/$DEVICE"
          VERSION_DIR="$DEVICE_DIR/$BUILD_REVISION"

          OTA_PART="$VERSION_DIR/ota-signed.zip.part"
          OTA_FINAL="$VERSION_DIR/ota-signed.zip"

          CSIG_PART="$VERSION_DIR/ota-signed.zip.csig.part"
          CSIG_FINAL="$VERSION_DIR/ota-signed.zip.csig"

          BOOT_PART="$VERSION_DIR/boot.img.part"
          BOOT_FINAL="$VERSION_DIR/boot.img"

          VERSION_JSON_PART="$VERSION_DIR/${DEVICE}.json.part"
          VERSION_JSON_FINAL="$VERSION_DIR/${DEVICE}.json"

          CURRENT_JSON_PART="$OTA_MOUNT/${DEVICE}.json.part"
          CURRENT_JSON_FINAL="$OTA_MOUNT/${DEVICE}.json"

          test -s "$SOURCE_OTA"
          test -s "$BOOT_IMG"
          test -s "$JSON_FILE"
          test -s "$CSIG_FILE"

          echo "=== Destination de publication ==="
          echo "Appareil   : $DEVICE"
          echo "Révision   : $BUILD_REVISION"
          echo "Répertoire : $VERSION_DIR"
          echo "JSON actif : $CURRENT_JSON_FINAL"

          mkdir -p "$VERSION_DIR"

          echo
          echo "=== Copie de l'OTA ==="

          rm -f "$OTA_PART"

          cp \
            "$SOURCE_OTA" \
            "$OTA_PART"

          test -s "$OTA_PART"

          COPIED_SHA256="$(
            sha256sum "$OTA_PART" \
              | awk '{print $1}'
          )"

          echo "SHA attendu : $EXPECTED_SHA256"
          echo "SHA copié   : $COPIED_SHA256"

          if [ "$COPIED_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Le SHA-256 de l'OTA copiée ne correspond pas"
            rm -f "$OTA_PART"
            exit 1
          fi

          mv -f "$OTA_PART" "$OTA_FINAL"

          echo
          echo "=== Copie du CSIG ==="

          rm -f "$CSIG_PART"

          cp \
            "$CSIG_FILE" \
            "$CSIG_PART"

          test -s "$CSIG_PART"

          mv -f "$CSIG_PART" "$CSIG_FINAL"

          echo
          echo "=== Copie du boot ==="

          rm -f "$BOOT_PART"

          cp \
            "$BOOT_IMG" \
            "$BOOT_PART"

          test -s "$BOOT_PART"

          mv -f "$BOOT_PART" "$BOOT_FINAL"

          echo
          echo "=== Copie du JSON historisé ==="

          rm -f "$VERSION_JSON_PART"

          cp \
            "$JSON_FILE" \
            "$VERSION_JSON_PART"

          jq empty "$VERSION_JSON_PART"

          mv -f \
            "$VERSION_JSON_PART" \
            "$VERSION_JSON_FINAL"

          echo
          echo "=== Publication du JSON actif ==="

          #
          # Le JSON actif est publié en dernier.
          # Custota ne peut donc jamais voir une nouvelle version avant que
          # l'OTA et son CSIG soient entièrement copiés.
          #
          rm -f "$CURRENT_JSON_PART"

          cp \
            "$JSON_FILE" \
            "$CURRENT_JSON_PART"

          jq empty "$CURRENT_JSON_PART"

          mv -f \
            "$CURRENT_JSON_PART" \
            "$CURRENT_JSON_FINAL"

          echo
          echo "=== Publication terminée ==="

          ls -lh \
            "$OTA_FINAL" \
            "$CSIG_FINAL" \
            "$BOOT_FINAL" \
            "$VERSION_JSON_FINAL" \
            "$CURRENT_JSON_FINAL"

          echo
          echo "=== SHA final sur Unraid ==="

          sha256sum "$OTA_FINAL"

      - name: Remove temporary unencrypted signing key
        if: always()
        shell: bash
        run: |
          rm -f "$WORKSPACE/keys/ota-custota.key"

      - name: Verify public Custota endpoints
        shell: bash
        env:
          DEVICE: ${{ steps.meta.outputs.device }}
          BUILD_REVISION: ${{ steps.meta.outputs.build_revision }}
        run: |
          set -euo pipefail

          JSON_URL="${OTA_PUBLIC_BASE_URL}/${DEVICE}.json"
          OTA_URL="${OTA_PUBLIC_BASE_URL}/${DEVICE}/${BUILD_REVISION}/ota-signed.zip"
          CSIG_URL="${OTA_URL}.csig"

          echo "=== Vérification du JSON public ==="
          echo "$JSON_URL"

          PUBLIC_JSON="$(
            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 3 \
              --silent \
              --show-error \
              "$JSON_URL"
          )"

          printf '%s\n' "$PUBLIC_JSON" | jq .

          echo
          echo "=== Vérification du CSIG public ==="
          echo "$CSIG_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --silent \
            --show-error \
            --output /dev/null \
            "$CSIG_URL"

          echo
          echo "=== Vérification HTTP Range de l'OTA ==="
          echo "$OTA_URL"

          HEADERS="$(
            mktemp
          )"

          trap 'rm -f "$HEADERS"' EXIT

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --silent \
            --show-error \
            --range 0-0 \
            --dump-header "$HEADERS" \
            --output /dev/null \
            "$OTA_URL"

          cat "$HEADERS"

          HTTP_STATUS="$(
            awk '
              toupper($1) ~ /^HTTP\// {
                status = $2
              }

              END {
                print status
              }
            ' "$HEADERS"
          )"

          if [ "$HTTP_STATUS" != "206" ]; then
            echo "::error::Le serveur n'a pas répondu HTTP 206 au Range request"
            echo "Statut reçu : $HTTP_STATUS"
            exit 1
          fi

          if ! grep -qi '^Content-Range:' "$HEADERS"; then
            echo "::error::En-tête Content-Range absent"
            exit 1
          fi

          echo
          echo "=== Publication Custota validée ==="
          echo "JSON : $JSON_URL"
          echo "OTA   : $OTA_URL"
          echo "CSIG  : $CSIG_URL"

          {
            echo
            echo "### Publication Custota réussie"
            echo
            echo "- Appareil : \`$DEVICE\`"
            echo "- Révision : \`$BUILD_REVISION\`"
            echo "- JSON : \`$JSON_URL\`"
            echo "- OTA : \`$OTA_URL\`"
            echo "- CSIG : \`$CSIG_URL\`"
            echo "- HTTP Range : \`206 Partial Content\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep only last 3 builds for device
        shell: bash
        env:
          DEVICE: ${{ steps.meta.outputs.device }}
          CURRENT_BUILD_REVISION: ${{ steps.meta.outputs.build_revision }}
        run: |
          set -euo pipefail

          DEVICE_DIR="$OTA_MOUNT/$DEVICE"
          KEEP_COUNT=3

          echo "=== Nettoyage des anciennes versions ==="
          echo "Appareil         : $DEVICE"
          echo "Répertoire       : $DEVICE_DIR"
          echo "Version active   : $CURRENT_BUILD_REVISION"
          echo "Versions gardées : $KEEP_COUNT"

          if [ ! -d "$DEVICE_DIR" ]; then
            echo "::error::Répertoire appareil introuvable : $DEVICE_DIR"
            exit 1
          fi

          if [ ! -s "$OTA_MOUNT/${DEVICE}.json" ]; then
            echo "::error::JSON courant absent : $OTA_MOUNT/${DEVICE}.json"
            exit 1
          fi

          if [ ! -s "$DEVICE_DIR/$CURRENT_BUILD_REVISION/ota-signed.zip" ]; then
            echo "::error::OTA active absente avant nettoyage"
            exit 1
          fi

          if [ ! -s "$DEVICE_DIR/$CURRENT_BUILD_REVISION/ota-signed.zip.csig" ]; then
            echo "::error::CSIG actif absent avant nettoyage"
            exit 1
          fi

          mapfile -t BUILDS < <(
            find "$DEVICE_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
            | grep -E '^[0-9]{12}$' \
            | sort -r
          )

          BUILD_COUNT="${#BUILDS[@]}"

          echo
          echo "=== Builds détectés : $BUILD_COUNT ==="

          if [ "$BUILD_COUNT" -eq 0 ]; then
            echo "::error::Aucun répertoire de build détecté"
            exit 1
          fi

          printf '%s\n' "${BUILDS[@]}"

          echo
          echo "=== Builds conservés ==="

          for build in "${BUILDS[@]:0:$KEEP_COUNT}"; do
            echo "KEEP   $build"
          done

          if [ "$BUILD_COUNT" -le "$KEEP_COUNT" ]; then
            echo
            echo "Aucun ancien build à supprimer."

            {
              echo
              echo "### Rétention"
              echo
              echo "- Appareil : \`$DEVICE\`"
              echo "- Builds conservés : \`$BUILD_COUNT\`"

              for build in "${BUILDS[@]}"; do
                echo "  - \`$build\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          echo
          echo "=== Builds supprimés ==="

          for build in "${BUILDS[@]:$KEEP_COUNT}"; do
            BUILD_PATH="$DEVICE_DIR/$build"

            if [ "$build" = "$CURRENT_BUILD_REVISION" ]; then
              echo "::error::Refus de supprimer la version active : $build"
              exit 1
            fi

            if ! printf '%s' "$build" |
              grep -Eq '^[0-9]{12}$'
            then
              echo "::error::Nom de build non valide : $build"
              exit 1
            fi

            case "$BUILD_PATH" in
              "$OTA_MOUNT/$DEVICE/"*)
                ;;
              *)
                echo "::error::Chemin de suppression non sécurisé : $BUILD_PATH"
                exit 1
                ;;
            esac

            echo "DELETE $build"

            rm -rf --one-file-system "$BUILD_PATH"
          done

          echo
          echo "=== État final ==="

          mapfile -t REMAINING_BUILDS < <(
            find "$DEVICE_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
            | grep -E '^[0-9]{12}$' \
            | sort -r
          )

          printf '%s\n' "${REMAINING_BUILDS[@]}"

          REMAINING_COUNT="${#REMAINING_BUILDS[@]}"

          if [ "$REMAINING_COUNT" -gt "$KEEP_COUNT" ]; then
            echo "::error::Il reste $REMAINING_COUNT builds au lieu de $KEEP_COUNT maximum"
            exit 1
          fi

          if [ ! -s "$DEVICE_DIR/$CURRENT_BUILD_REVISION/ota-signed.zip" ]; then
            echo "::error::La version active a disparu après nettoyage"
            exit 1
          fi

          if [ ! -s "$DEVICE_DIR/$CURRENT_BUILD_REVISION/ota-signed.zip.csig" ]; then
            echo "::error::Le CSIG actif a disparu après nettoyage"
            exit 1
          fi

          echo
          echo "Nettoyage terminé : $REMAINING_COUNT build(s) conservé(s) pour $DEVICE."

          {
            echo
            echo "### Rétention"
            echo
            echo "- Appareil : \`$DEVICE\`"
            echo "- Builds conservés : \`$REMAINING_COUNT\`"

            for build in "${REMAINING_BUILDS[@]}"; do
              echo "  - \`$build\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
