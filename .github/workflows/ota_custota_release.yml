name: Build OTA + Publish Custota

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Build Kernel"
    types:
      - completed
      
permissions:
  contents: write
  actions: read

jobs:
  ota-release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on:
      - self-hosted
      - Linux
      - X64
      - android-worker

    env:
      WORKSPACE: /home/aurelien/workspace

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact from triggering run
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: kernel-build
          path: ${{ env.WORKSPACE }}/custota

      - name: Download latest successful build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: compile_pixel_susfs.yml
          workflow_conclusion: success
          branch: main
          name: kernel-build
          path: ${{ env.WORKSPACE }}/custota

      - name: Verify downloaded build artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Contenu téléchargé ==="

          find "$WORKSPACE/custota" \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            | sort

          METADATA="$(
            find "$WORKSPACE/custota" \
              -type f \
              -name 'build-metadata.json' \
              -print \
              -quit
          )"

          BOOT_IMG="$(
            find "$WORKSPACE/custota" \
              -type f \
              -name '*_boot_KSUNext_*_SUSFS_*.img' \
              -print \
              -quit
          )"

          if [ -z "$METADATA" ] || [ ! -s "$METADATA" ]; then
            echo "::error::build-metadata.json introuvable dans l'artifact"
            exit 1
          fi

          if [ -z "$BOOT_IMG" ] || [ ! -s "$BOOT_IMG" ]; then
            echo "::error::Image boot KernelSU-Next introuvable dans l'artifact"
            exit 1
          fi

          echo
          echo "Metadata : $METADATA"
          echo "Boot     : $BOOT_IMG"

          echo
          echo "=== Métadonnées ==="
          jq . "$METADATA"
    
      - name: Locate files
        id: files
        shell: bash
        run: |
          set -euo pipefail

          BOOT_IMG="$(
            find "$WORKSPACE/custota" \
              -type f \
              -name '*_boot_KSUNext_*_SUSFS_*.img' \
              -print \
              -quit
          )"

          META_JSON="$(
            find "$WORKSPACE/custota" \
              -type f \
              -name "build-metadata.json" \
              -print \
              -quit
          )"

          test -f "$BOOT_IMG"
          test -f "$META_JSON"

          echo "BOOT_IMG=$BOOT_IMG"
          echo "META_JSON=$META_JSON"

          echo "boot_img=$BOOT_IMG" >> "$GITHUB_OUTPUT"
          echo "meta_json=$META_JSON" >> "$GITHUB_OUTPUT"
          
      - name: Read metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          META="${{ steps.files.outputs.meta_json }}"

          OTA_URL="$(jq -r '.ota_url' "$META")"
          SPL="$(jq -r '.spl' "$META")"
          KSU_VERSION="$(jq -r '.ksu_version' "$META")"
          SUSFS_VERSION="$(jq -r '.susfs_version' "$META")"

          echo "ota_url=$OTA_URL" >> "$GITHUB_OUTPUT"
          echo "spl=$SPL" >> "$GITHUB_OUTPUT"
          echo "ksu_version=$KSU_VERSION" >> "$GITHUB_OUTPUT"
          echo "susfs_version=$SUSFS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download OTA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$WORKSPACE/ota"

          curl \
            -L \
            "${{ steps.meta.outputs.ota_url }}" \
            -o "$WORKSPACE/ota/stock.zip"

      - name: Restore signing keys
        shell: bash
        env:
          AVB_KEY_B64: ${{ secrets.AVB_KEY_B64 }}
          OTA_KEY_B64: ${{ secrets.OTA_KEY_B64 }}
          OTA_CRT_B64: ${{ secrets.OTA_CRT_B64 }}
          AVB_PASS: ${{ secrets.AVB_PASS }}
          OTA_PASS: ${{ secrets.OTA_PASS }}
        run: |
          set -euo pipefail
      
          mkdir -p "$WORKSPACE/keys"
      
          printf '%s' "$AVB_KEY_B64" \
            | base64 -d \
            > "$WORKSPACE/keys/avb.key"
      
          printf '%s' "$OTA_KEY_B64" \
            | base64 -d \
            > "$WORKSPACE/keys/ota.key"
      
          printf '%s' "$OTA_CRT_B64" \
            | base64 -d \
            > "$WORKSPACE/keys/ota.crt"
      
          printf '%s' "$AVB_PASS" \
            > "$WORKSPACE/keys/avb.pass"
      
          printf '%s' "$OTA_PASS" \
            > "$WORKSPACE/keys/ota.pass"
      
          chmod 600 "$WORKSPACE/keys/"*

      - name: Install avbroot
        shell: bash
        env:
          AVBROOT_VERSION: "3.34.1"
        run: |
          set -euo pipefail

          TOOLS_DIR="$WORKSPACE/tools"
          AVBROOT_BIN="$TOOLS_DIR/avbroot"
          AVBROOT_ZIP="$TOOLS_DIR/avbroot.zip"

          mkdir -p "$TOOLS_DIR"

          if [ -x "$AVBROOT_BIN" ]; then
            echo "=== avbroot déjà installé ==="
            "$AVBROOT_BIN" --version
            exit 0
          fi

          ARCH="$(uname -m)"

          case "$ARCH" in
            x86_64)
              TARGET="x86_64-unknown-linux-gnu"
              ;;
            aarch64|arm64)
              TARGET="aarch64-unknown-linux-gnu"
              ;;
            *)
              echo "::error::Architecture non supportée : $ARCH"
              exit 1
              ;;
          esac

          DOWNLOAD_URL="https://github.com/chenxiaolong/avbroot/releases/download/v${AVBROOT_VERSION}/avbroot-${AVBROOT_VERSION}-${TARGET}.zip"

          echo "=== Téléchargement avbroot ==="
          echo "Version : $AVBROOT_VERSION"
          echo "Cible   : $TARGET"
          echo "URL     : $DOWNLOAD_URL"

          rm -f "$AVBROOT_ZIP"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --show-error \
            "$DOWNLOAD_URL" \
            --output "$AVBROOT_ZIP"

          echo
          echo "=== Archive téléchargée ==="

          ls -lh "$AVBROOT_ZIP"
          file "$AVBROOT_ZIP"

          unzip -t "$AVBROOT_ZIP"

          rm -f "$AVBROOT_BIN"

          unzip -o \
            "$AVBROOT_ZIP" \
            -d "$TOOLS_DIR"

          if [ ! -f "$AVBROOT_BIN" ]; then
            echo "::error::Binaire avbroot introuvable après extraction"

            find "$TOOLS_DIR" \
              -maxdepth 3 \
              -type f \
              -printf '%p\n' \
              | sort

            exit 1
          fi

          chmod 700 "$AVBROOT_BIN"

          echo
          echo "=== Version installée ==="

          "$AVBROOT_BIN" --version
      - name: Verify boot used by avbroot
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Boot sélectionné ==="

          ls -lh \
            "${{ steps.files.outputs.boot_img }}"

          sha256sum \
            "${{ steps.files.outputs.boot_img }}"

          echo
          echo "=== Version Kernel ==="

          strings "${{ steps.files.outputs.boot_img }}" \
            | grep -a "Linux version" \
            | head -1

          echo
          echo "=== PREEMPT ==="

          strings "${{ steps.files.outputs.boot_img }}" \
            | grep -a "PREEMPT" \
            | head -5
            
      - name: Patch OTA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$WORKSPACE/release"

          "$WORKSPACE/tools/avbroot" ota patch \
            --input "$WORKSPACE/ota/stock.zip" \
            --output "$WORKSPACE/release/ota-signed.zip" \
            --key-avb "$WORKSPACE/keys/avb.key" \
            --key-ota "$WORKSPACE/keys/ota.key" \
            --cert-ota "$WORKSPACE/keys/ota.crt" \
            --pass-avb-file "$WORKSPACE/keys/avb.pass" \
            --pass-ota-file "$WORKSPACE/keys/ota.pass" \
            --prepatched "${{ steps.files.outputs.boot_img }}"
      - name: Verify OTA boot image
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORKSPACE/release"

          "$WORKSPACE/tools/avbroot" ota extract \
            --input ota-signed.zip

          echo
          echo "=== Boot extrait OTA ==="

          strings boot.img \
            | grep -a "Linux version" \
            | head -1

          echo
          echo "=== PREEMPT OTA ==="

          strings boot.img \
            | grep -a "PREEMPT" \
            | head -5

          echo
          echo "=== SHA OTA ==="

          sha256sum boot.img
      - name: Generate SHA256
        id: sha
        shell: bash
        run: |
          set -euo pipefail

          SHA256="$(
            sha256sum "$WORKSPACE/release/ota-signed.zip" \
            | awk '{print $1}'
          )"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          
      - name: Generate Custota version
        id: buildver
        shell: bash
        run: |
          set -euo pipefail

          KSU="${{ steps.meta.outputs.ksu_version }}"

          SUSFS="$(
            echo '${{ steps.meta.outputs.susfs_version }}' |
            sed 's/^v//' |
            tr -d '.'
          )"

          REV="$(
            echo '${{ steps.meta.outputs.build_revision }}' |
            cut -c9-12
          )"

          CUSTOTA_VERSION_CODE="${KSU}${SUSFS}${REV}"

          echo "custota_version=$CUSTOTA_VERSION_CODE" \
            >> "$GITHUB_OUTPUT"

          echo "CUSTOTA_VERSION_CODE=$CUSTOTA_VERSION_CODE"
          
      - name: Generate Custota JSON
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.spl }}_KSUNext_${{ steps.meta.outputs.ksu_version }}_SUSFS_${{ steps.meta.outputs.susfs_version }}"

          cat > "$WORKSPACE/release/grizzly.json" <<EOF
          {
            "version": "${{ steps.meta.outputs.spl }}-r${{ steps.meta.outputs.build_revision }}",
            "versionCode": ${{ steps.buildver.outputs.custota_version }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${TAG}/ota-signed.zip",
            "zipSha256": "${{ steps.sha.outputs.sha256 }}",
            "changelog": "KernelSU Next ${{ steps.meta.outputs.ksu_version }} + SUSFS ${{ steps.meta.outputs.susfs_version }}"
          }
          EOF
          
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.spl }}_KSUNext_${{ steps.meta.outputs.ksu_version }}_SUSFS_${{ steps.meta.outputs.susfs_version }}"

          gh release create "$TAG" \
            "$WORKSPACE/release/ota-signed.zip" \
            "$WORKSPACE/release/grizzly.json" \
            "${{ steps.files.outputs.boot_img }}" \
            --title "$TAG" \
            --latest
