name: Download latest Kernel Sources

on:
  workflow_dispatch:
    inputs:
      drive_folder_url:
        description: "Lien du dossier Google Drive contenant kernels-*.tar.xz"
        required: true
        type: string

jobs:
  download-and-extract:

    runs-on:
      - self-hosted
      - Linux
      - X64
      - android-worker

    timeout-minutes: 60

    env:
      WORKSPACE: /home/aurelien/workspace

    steps:

      - name: Verify runner
        shell: bash
        run: |
          set -euo pipefail

          echo "=== HOST ==="
          hostname

          echo "=== USER ==="
          whoami

          echo "=== PWD ==="
          pwd

          mkdir -p "$WORKSPACE/src"
          mkdir -p "$WORKSPACE/build"
          mkdir -p "$WORKSPACE/dist"

          echo
          echo "=== WORKSPACE ==="
          ls -lah "$WORKSPACE"

          echo
          echo "=== DISK ==="
          df -h

      - name: Extract folder ID
        id: folder
        shell: bash
        env:
          DRIVE_FOLDER_URL: ${{ inputs.drive_folder_url }}
        run: |
          set -euo pipefail

          FOLDER_ID="$(
            printf '%s' "$DRIVE_FOLDER_URL" |
            sed -nE 's#.*(/folders/|[?&]id=)([^/?&]+).*#\2#p'
          )"

          if [ -z "$FOLDER_ID" ]; then
            echo "::error::Impossible d'extraire l'ID du dossier Google Drive"
            exit 1
          fi

          echo "folder_id=$FOLDER_ID" >> "$GITHUB_OUTPUT"

          echo "Folder ID : $FOLDER_ID"

      - name: Get Google access token
        id: auth
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl --silent \
              --request POST \
              --data-urlencode "client_id=$GOOGLE_CLIENT_ID" \
              --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" \
              --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN" \
              --data-urlencode "grant_type=refresh_token" \
              "https://oauth2.googleapis.com/token"
          )"

          ACCESS_TOKEN="$(jq -r '.access_token // empty' <<< "$RESPONSE")"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Impossible d'obtenir un access_token"
            echo "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Find latest kernels archive
        id: kernel
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FOLDER_ID: ${{ steps.folder.outputs.folder_id }}
        run: |
          set -euo pipefail

          QUERY="'${FOLDER_ID}' in parents and trashed=false and name contains 'kernels-'"

          RESPONSE="$(
            curl --silent \
              --get \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              --data-urlencode "q=$QUERY" \
              --data-urlencode "orderBy=modifiedTime desc" \
              --data-urlencode "pageSize=100" \
              --data-urlencode "fields=files(id,name,size,modifiedTime)" \
              "https://www.googleapis.com/drive/v3/files"
          )"

          FILE="$(
            jq -c '
              [
                .files[]
                | select(.name | test("^kernels-.*\\.tar\\.xz$"))
              ]
              | sort_by(.modifiedTime)
              | reverse
              | .[0]
            ' <<< "$RESPONSE"
          )"

          if [ "$FILE" = "null" ]; then
            echo "::error::Aucun kernels-*.tar.xz trouvé"
            exit 1
          fi

          FILE_ID="$(jq -r '.id' <<< "$FILE")"
          FILE_NAME="$(jq -r '.name' <<< "$FILE")"
          FILE_SIZE="$(jq -r '.size' <<< "$FILE")"
          FILE_DATE="$(jq -r '.modifiedTime' <<< "$FILE")"

          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

          echo
          echo "Archive sélectionnée :"
          echo "Nom     : $FILE_NAME"
          echo "Taille  : $FILE_SIZE"
          echo "Date    : $FILE_DATE"

      - name: Download latest archive
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FILE_ID: ${{ steps.kernel.outputs.file_id }}
          FILE_NAME: ${{ steps.kernel.outputs.file_name }}
        run: |
          set -euo pipefail

          ARCHIVE="$WORKSPACE/src/$FILE_NAME"

          echo "Archive attendue :"
          echo "$ARCHIVE"

          if [ -f "$ARCHIVE" ] && [ -s "$ARCHIVE" ]; then

            echo
            echo "================================="
            echo "ARCHIVE DEJA PRESENTE"
            echo "================================="
            echo

            ls -lh "$ARCHIVE"
            file "$ARCHIVE"

          else

            echo
            echo "================================="
            echo "TELECHARGEMENT"
            echo "================================="
            echo

            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-delay 5 \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              "https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media" \
              --output "$ARCHIVE"

            echo
            echo "Archive téléchargée :"

            ls -lh "$ARCHIVE"
            file "$ARCHIVE"

          fi

          echo
          echo "=== Archives présentes ==="

          ls -lh "$WORKSPACE/src"

      - name: Cleanup old archives
        shell: bash
        run: |
          find "$WORKSPACE/src" \
            -name 'kernels-*.tar.xz' \
            -mtime +90 \
            -delete || true

          echo "=== Archives conservées ==="
          ls -lh "$WORKSPACE/src"

      - name: Extract kernel sources
        id: extract
        shell: bash
        env:
          FILE_NAME: ${{ steps.kernel.outputs.file_name }}
        run: |
          set -euo pipefail

          echo "=== CLEAN BUILD DIR ==="

          rm -rf "$WORKSPACE/build"/*

          mkdir -p "$WORKSPACE/build"

          echo "=== EXTRACT ==="

          tar -xf \
            "$WORKSPACE/src/$FILE_NAME" \
            -C "$WORKSPACE/build"

          echo "source_dir=$WORKSPACE/build" >> "$GITHUB_OUTPUT"

      - name: Inspect extracted sources
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=== ROOT ==="
          ls -lah "$WORKSPACE/build"

          echo
          echo "=== LEVEL 1 ==="
          find "$WORKSPACE/build" \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%y %p\n' | sort

          echo
          echo "=== LEVEL 2 ==="
          find "$WORKSPACE/build" \
            -mindepth 1 \
            -maxdepth 2 \
            -printf '%y %p\n' | sort | head -250

          echo
          echo "=== SIZE ==="
          du -sh "$WORKSPACE/build"/* 2>/dev/null | sort -h || true

          echo
          echo "=== KERNEL MARKERS ==="

          find "$WORKSPACE/build" \
            -maxdepth 5 \
            \( \
              -name BUILD.bazel \
              -o -name WORKSPACE \
              -o -name MODULE.bazel \
              -o -name build.config \
              -o -name build.config.gki.aarch64 \
              -o -name Makefile \
            \) \
            -print | sort
            
      - name: Detect kernel root
        id: root
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_ROOT="$(find "$WORKSPACE/build" \
            -maxdepth 1 \
            -type d \
            -name 'kernel-spacecraft-*' \
            | head -n1)"

          if [ -z "$KERNEL_ROOT" ]; then
            echo "::error::kernel-spacecraft-* introuvable"
            exit 1
          fi

          echo "kernel_root=$KERNEL_ROOT" >> "$GITHUB_OUTPUT"

          echo "Kernel root:"
          echo "$KERNEL_ROOT"

          ls -lah "$KERNEL_ROOT"
          
      - name: Install KernelSU-Next (dev-susfs)
        shell: bash
        env:
          KERNEL_ROOT: ${{ steps.root.outputs.kernel_root }}
        run: |
          set -euo pipefail

          cd "$KERNEL_ROOT/common/ack"

          if [ -d KernelSU ]; then
            echo "KernelSU déjà présent, installation ignorée"
            exit 0
          fi

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s dev-susfs

          echo
          echo "=== Vérification KernelSU ==="

          find . -maxdepth 2 -iname '*kernelsu*' | sort || true

          git status || true
          
      - name: Verify ACK
        shell: bash
        env:
          KERNEL_ROOT: ${{ steps.root.outputs.kernel_root }}
        run: |
          set -euo pipefail

          ls -lah "$KERNEL_ROOT/common/ack"

          cat "$KERNEL_ROOT/common/ack/build.config.gki.aarch64" | head
