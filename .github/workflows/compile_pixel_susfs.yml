      - name: Gather versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
      
          echo "ksu_version=none" >> "$GITHUB_OUTPUT"
          echo "susfs_version=none" >> "$GITHUB_OUTPUT"
    
      - name: Extract SPL from boot image
        id: spl
        shell: bash
        env:
          BOOT_IMG: ${{ steps.ota.outputs.boot_img }}
        run: |
          set -euo pipefail
      
          SPL="$(
            strings "$BOOT_IMG" |
            awk '
              /com.android.build.boot.security_patch/ {
                getline
                print
                exit
              }
            '
          )"
      
          if [ -z "$SPL" ]; then
            echo "::error::Unable to extract SPL from boot image"
            exit 1
          fi
      
          echo "spl=$SPL" >> "$GITHUB_OUTPUT"
      
          echo "SPL=$SPL"

      - name: Repack boot image
        id: repack
        shell: bash
        env:
          BOOT_IMG: ${{ steps.ota.outputs.boot_img }}
          KSU_VERSION: ${{ steps.versions.outputs.ksu_version }}
          SUSFS_VERSION: ${{ steps.versions.outputs.susfs_version }}
          SPL: ${{ steps.spl.outputs.spl }}
          KERNEL_ROOT: ${{ steps.root.outputs.kernel_root }}
        run: |
          set -euo pipefail

          MAGISKBOOT="$WORKSPACE/tools/magiskboot"

          mkdir -p "$WORKSPACE/dist/repack"

          cd "$WORKSPACE/dist/repack"

          cp "$BOOT_IMG" boot.img

          "$MAGISKBOOT" unpack boot.img

          cp \
            "$KERNEL_ROOT/bazel-bin/common/gki/kernel_aarch64/Image.lz4" \
            kernel

          "$MAGISKBOOT" repack boot.img

          FINAL_NAME="${SPL}_boot_KSUNext_${KSU_VERSION}_SUSFS_${SUSFS_VERSION}.img"

          mv new-boot.img "$WORKSPACE/dist/$FINAL_NAME"

          echo "artifact=$WORKSPACE/dist/$FINAL_NAME" >> "$GITHUB_OUTPUT"

          ls -lh "$WORKSPACE/dist/$FINAL_NAME"

      - name: Save build metadata
        shell: bash
        env:
          OTA_URL: ${{ inputs.ota_url }}
          SPL: ${{ steps.spl.outputs.spl }}
          KSU_VERSION: ${{ steps.versions.outputs.ksu_version }}
          SUSFS_VERSION: ${{ steps.versions.outputs.susfs_version }}
          ARTIFACT: ${{ steps.repack.outputs.artifact }}
        run: |
          set -euo pipefail
      
          BASENAME="$(basename "$ARTIFACT")"
      
          BUILD_REVISION="$(date +%Y%m%d%H%M)"
      
          VERSION_CODE="$(
            strings "$ARTIFACT" |
            grep -a "user/release-keys" |
            head -1 |
            sed -n 's#.*\/\([0-9]\+\):user/release-keys#\1#p'
          )"
      
          cat > "$WORKSPACE/dist/build-metadata.json" <<EOF
          {
            "ota_url": "$OTA_URL",
            "spl": "$SPL",
            "version_code": "$VERSION_CODE",
            "ksu_version": "$KSU_VERSION",
            "susfs_version": "$SUSFS_VERSION",
            "build_revision": "$BUILD_REVISION",
            "boot_filename": "$BASENAME"
          }
          EOF
      
          cat "$WORKSPACE/dist/build-metadata.json"
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            ${{ steps.repack.outputs.artifact }}
            /home/aurelien/workspace/dist/build-metadata.json
          if-no-files-found: error
          retention-days: 30
