name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      drive_folder_url:
        description: "Lien Google Drive des sources. Laisser vide pour patcher init_boot avec KernelSU-Next sans compilation"
        required: false
        default: ""
        type: string
      ota_url:
        description: "URL OTA Google"
        required: true
        type: string

jobs:
  download-and-extract:
    if: inputs.drive_folder_url != ''
    runs-on:
      - self-hosted
      - Linux
      - X64
      - android-worker

    timeout-minutes: 60

    env:
      WORKSPACE: /home/aurelien/workspace
      KERNEL_FAMILY: spacecraft

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Verify runner
        shell: bash
        run: |
          set -euo pipefail

          echo "=== HOST ==="
          hostname
          echo "=== USER ==="
          whoami
          echo "=== PWD ==="
          pwd

          mkdir -p "$WORKSPACE/src" "$WORKSPACE/build" "$WORKSPACE/dist" "$WORKSPACE/tools"

          echo "=== WORKSPACE ==="
          ls -lah "$WORKSPACE"
          echo "=== DISK ==="
          df -h

      - name: Extract Drive folder ID
        id: folder
        shell: bash
        env:
          DRIVE_FOLDER_URL: ${{ inputs.drive_folder_url }}
        run: |
          set -euo pipefail

          FOLDER_ID="$(
            printf '%s' "$DRIVE_FOLDER_URL" |
            sed -nE 's#.*(/folders/|[?&]id=)([^/?&]+).*#\2#p'
          )"

          if [ -z "$FOLDER_ID" ]; then
            echo "::error::Impossible d'extraire l'ID du dossier Google Drive"
            exit 1
          fi

          echo "folder_id=$FOLDER_ID" >> "$GITHUB_OUTPUT"
          echo "Folder ID: $FOLDER_ID"

      - name: Get Google access token
        id: auth
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl --silent --show-error --fail \
              --request POST \
              --data-urlencode "client_id=$GOOGLE_CLIENT_ID" \
              --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" \
              --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN" \
              --data-urlencode "grant_type=refresh_token" \
              "https://oauth2.googleapis.com/token"
          )"

          ACCESS_TOKEN="$(jq -r '.access_token // empty' <<< "$RESPONSE")"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Impossible d'obtenir un access_token"
            echo "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      # L'OTA doit être analysée AVANT la sélection du snapshot kernel.
      - name: Install payload-dumper
        shell: bash
        run: |
          set -euo pipefail

          TOOLS_DIR="$WORKSPACE/tools"
          UV_BIN="$TOOLS_DIR/uv"
          PAYLOAD_VENV="$TOOLS_DIR/payload-dumper-venv"

          mkdir -p "$TOOLS_DIR"

          if [ ! -x "$UV_BIN" ]; then
            UV_INSTALL_DIR="$TOOLS_DIR/uv-install"
            rm -rf "$UV_INSTALL_DIR"
            mkdir -p "$UV_INSTALL_DIR"

            curl --fail --location --silent --show-error \
              "https://astral.sh/uv/install.sh" \
              --output "$TOOLS_DIR/install-uv.sh"

            env UV_INSTALL_DIR="$UV_INSTALL_DIR" UV_NO_MODIFY_PATH=1 \
              sh "$TOOLS_DIR/install-uv.sh"

            UV_FOUND="$(
              find "$UV_INSTALL_DIR" -type f -name uv -perm -u+x -print -quit
            )"

            if [ -z "$UV_FOUND" ]; then
              echo "::error::Le binaire uv n'a pas été installé"
              find "$UV_INSTALL_DIR" -maxdepth 3 -type f -ls || true
              exit 1
            fi

            cp "$UV_FOUND" "$UV_BIN"
            chmod +x "$UV_BIN"
            rm -f "$TOOLS_DIR/install-uv.sh"
            rm -rf "$UV_INSTALL_DIR"
          fi

          "$UV_BIN" --version

          if [ ! -x "$PAYLOAD_VENV/bin/python" ]; then
            rm -rf "$PAYLOAD_VENV"
            "$UV_BIN" venv --python python3 "$PAYLOAD_VENV"
          fi

          "$UV_BIN" pip install \
            --python "$PAYLOAD_VENV/bin/python" \
            --upgrade \
            "git+https://github.com/5ec1cff/payload-dumper.git"

          test -x "$PAYLOAD_VENV/bin/payload_dumper"
          "$PAYLOAD_VENV/bin/payload_dumper" --help >/dev/null

      - name: Install extract-ikconfig
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TOOLS_DIR="$WORKSPACE/tools"
          EXTRACT_IKCONFIG="$TOOLS_DIR/extract-ikconfig"
          TEMP_FILE="${EXTRACT_IKCONFIG}.tmp"

          mkdir -p "$TOOLS_DIR"

          echo "=== Vérification du cache local ==="

          if [ -s "$EXTRACT_IKCONFIG" ]; then
            chmod +x "$EXTRACT_IKCONFIG"

            if grep -q 'extract-ikconfig' "$EXTRACT_IKCONFIG" &&
               head -n1 "$EXTRACT_IKCONFIG" | grep -q '^#!'
            then
              echo "extract-ikconfig déjà présent et valide :"
              ls -lh "$EXTRACT_IKCONFIG"
              head -n5 "$EXTRACT_IKCONFIG"
              exit 0
            fi

            echo "::warning::Le fichier en cache est invalide, suppression."
            rm -f "$EXTRACT_IKCONFIG"
          fi

          rm -f "$TEMP_FILE"

          echo
          echo "=== Téléchargement via GitHub API ==="

          API_URL="https://api.github.com/repos/torvalds/linux/contents/scripts/extract-ikconfig?ref=master"

          RESPONSE_FILE="$RUNNER_TEMP/extract-ikconfig-response.json"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output "$RESPONSE_FILE" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github.raw+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 10 \
              "$API_URL"
          )"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Échec du téléchargement de extract-ikconfig"
            echo "HTTP_STATUS=$HTTP_STATUS"

            if [ -s "$RESPONSE_FILE" ]; then
              cat "$RESPONSE_FILE"
            fi

            exit 1
          fi

          mv "$RESPONSE_FILE" "$TEMP_FILE"

          echo
          echo "=== Validation du script téléchargé ==="

          if ! head -n1 "$TEMP_FILE" | grep -q '^#!'; then
            echo "::error::Le fichier téléchargé n'est pas un script valide"
            head -n20 "$TEMP_FILE"
            rm -f "$TEMP_FILE"
            exit 1
          fi

          if ! grep -q 'extract-ikconfig' "$TEMP_FILE"; then
            echo "::error::Le contenu téléchargé ne ressemble pas à extract-ikconfig"
            head -n20 "$TEMP_FILE"
            rm -f "$TEMP_FILE"
            exit 1
          fi

          mv "$TEMP_FILE" "$EXTRACT_IKCONFIG"
          chmod +x "$EXTRACT_IKCONFIG"

          echo
          echo "=== extract-ikconfig installé ==="

          ls -lh "$EXTRACT_IKCONFIG"
          head -n5 "$EXTRACT_IKCONFIG"

      - name: Install MagiskBoot
        shell: bash
        run: |
          set -euo pipefail

          MAGISKBOOT="$WORKSPACE/tools/magiskboot"

          if [ ! -x "$MAGISKBOOT" ]; then
            cd "$WORKSPACE/tools"

            curl --fail --location --silent --show-error \
              "https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk" \
              --output magisk.apk

            unzip -o -j magisk.apk "lib/x86_64/libmagiskboot.so" -d .
            mv libmagiskboot.so magiskboot
            chmod +x magiskboot
          fi

          test -x "$MAGISKBOOT"
          echo "MagiskBoot installé"

      - name: Extract boot and ABL images from OTA
        id: ota
        shell: bash
        env:
          OTA_URL: ${{ inputs.ota_url }}
        run: |
          set -euo pipefail

          PAYLOAD_DUMPER="$WORKSPACE/tools/payload-dumper-venv/bin/payload_dumper"
          OTA_OUTPUT_DIR="$WORKSPACE/ota"

          if [ ! -x "$PAYLOAD_DUMPER" ]; then
            echo "::error::payload_dumper n'est pas installé : $PAYLOAD_DUMPER"
            exit 1
          fi

          case "$OTA_URL" in
            http://*|https://*)
              ;;
            *)
              echo "::error::URL OTA invalide : $OTA_URL"
              exit 1
              ;;
          esac

          rm -rf "$OTA_OUTPUT_DIR"
          mkdir -p "$OTA_OUTPUT_DIR"

          cd "$OTA_OUTPUT_DIR"

          echo "=== Extraction de boot et abl depuis l'OTA ==="
          echo "OTA : $OTA_URL"

          "$PAYLOAD_DUMPER" \
            --partitions boot,abl \
            "$OTA_URL"

          BOOT_IMG="$OTA_OUTPUT_DIR/output/boot.img"
          ABL_IMG="$OTA_OUTPUT_DIR/output/abl.img"

          if [ ! -s "$BOOT_IMG" ]; then
            echo "::error::boot.img n'a pas été extrait"
            find "$OTA_OUTPUT_DIR" -maxdepth 3 -type f -ls || true
            exit 1
          fi

          if [ ! -s "$ABL_IMG" ]; then
            echo "::error::abl.img n'a pas été extrait"
            find "$OTA_OUTPUT_DIR" -maxdepth 3 -type f -ls || true
            exit 1
          fi

          {
            echo "boot_img=$BOOT_IMG"
            echo "abl_img=$ABL_IMG"
          } >> "$GITHUB_OUTPUT"

          echo
          echo "=== Images stock extraites ==="

          ls -lh "$BOOT_IMG" "$ABL_IMG"
          file "$BOOT_IMG" "$ABL_IMG"

      - name: Extract stock kernel and Spacecraft metadata
        id: stockkernel
        shell: bash
        env:
          BOOT_IMG: ${{ steps.ota.outputs.boot_img }}
          ABL_IMG: ${{ steps.ota.outputs.abl_img }}
        run: |
          set -euo pipefail

          test -s "$BOOT_IMG"
          test -s "$ABL_IMG"

          echo "=== Analyse de boot.img ==="

          FULL_VERSION="$(
            strings "$BOOT_IMG" \
              | grep -a -m1 'Linux version ' \
              || true
          )"

          PREEMPT_LINE="$(
            strings "$BOOT_IMG" \
              | grep -a -m1 '^#1 SMP PREEMPT ' \
              || true
          )"

          if [ -z "$FULL_VERSION" ]; then
            echo "::error::Chaîne Linux version introuvable dans boot.img"
            exit 1
          fi

          if [ -z "$PREEMPT_LINE" ]; then
            echo "::error::Ligne PREEMPT introuvable dans boot.img"
            exit 1
          fi

          RELEASE_SUFFIX="$(
            printf '%s\n' "$FULL_VERSION" \
              | grep -aoE -- '-android[^ )]+' \
              | head -n1 \
              || true
          )"

          GKI_BUILD_ID="$(
            printf '%s\n' "$FULL_VERSION" \
              | grep -aoE 'ab[0-9]+' \
              | head -n1 \
              | sed 's/^ab//' \
              || true
          )"

          BUILD_TIMESTAMP="$(
            printf '%s\n' "$PREEMPT_LINE" \
              | sed -E 's/^#1 SMP PREEMPT( DYNAMIC)? //' \
              || true
          )"

          echo
          echo "=== Analyse de abl.img ==="

          BOOTLOADER_VERSION="$(
            strings "$ABL_IMG" \
              | grep -a -m1 -E "^${KERNEL_FAMILY}-[0-9]+\.[0-9]+-[0-9]+$" \
              || true
          )"

          if [ -z "$BOOTLOADER_VERSION" ]; then
            echo "::error::Version du bootloader ${KERNEL_FAMILY} introuvable dans abl.img"
            echo
            echo "=== Candidats trouvés dans abl.img ==="

            strings "$ABL_IMG" \
              | grep -a -E -i "${KERNEL_FAMILY}|bootloader|[0-9]{7,8}" \
              | head -n 100 \
              || true

            exit 1
          fi

          SPACECRAFT_BUILD_ID="$(
            printf '%s\n' "$BOOTLOADER_VERSION" \
              | grep -aoE '[0-9]+$' \
              || true
          )"

          if [ -z "$RELEASE_SUFFIX" ]; then
            echo "::error::Suffixe kernel stock introuvable"
            echo "FULL_VERSION=$FULL_VERSION"
            exit 1
          fi

          if [ -z "$GKI_BUILD_ID" ]; then
            echo "::error::Build ID GKI abXXXXXXXX introuvable"
            echo "FULL_VERSION=$FULL_VERSION"
            exit 1
          fi

          if [ -z "$BUILD_TIMESTAMP" ]; then
            echo "::error::Timestamp kernel stock introuvable"
            exit 1
          fi

          if [ -z "$SPACECRAFT_BUILD_ID" ]; then
            echo "::error::Révision Spacecraft introuvable"
            echo "BOOTLOADER_VERSION=$BOOTLOADER_VERSION"
            exit 1
          fi

          case "$BUILD_TIMESTAMP" in
            *" 1970")
              echo "::error::Le timestamp stock extrait vaut 1970"
              exit 1
              ;;
          esac

          SOURCE_DATE_EPOCH="$(
            date \
              --utc \
              --date="$BUILD_TIMESTAMP" \
              +%s
          )"

          {
            echo "release_suffix=$RELEASE_SUFFIX"
            echo "build_timestamp=$BUILD_TIMESTAMP"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
            echo "gki_build_id=$GKI_BUILD_ID"
            echo "spacecraft_build_id=$SPACECRAFT_BUILD_ID"
            echo "bootloader_version=$BOOTLOADER_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo
          echo "========================================"
          echo "MÉTADONNÉES OTA"
          echo "========================================"
          echo
          echo "FULL_VERSION=$FULL_VERSION"
          echo "RELEASE_SUFFIX=$RELEASE_SUFFIX"
          echo "GKI_BUILD_ID=$GKI_BUILD_ID"
          echo "PREEMPT_LINE=$PREEMPT_LINE"
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          echo
          echo "BOOTLOADER_VERSION=$BOOTLOADER_VERSION"
          echo "SPACECRAFT_BUILD_ID=$SPACECRAFT_BUILD_ID"
          echo
          echo "Archive Drive attendue :"
          echo "kernel-${KERNEL_FAMILY}-${SPACECRAFT_BUILD_ID}.tar.xz"

          {
            echo "### Métadonnées de l'OTA"
            echo
            echo "- GKI build ID : \`$GKI_BUILD_ID\`"
            echo "- Bootloader : \`$BOOTLOADER_VERSION\`"
            echo "- Révision Spacecraft : \`$SPACECRAFT_BUILD_ID\`"
            echo "- Archive attendue : \`kernel-${KERNEL_FAMILY}-${SPACECRAFT_BUILD_ID}.tar.xz\`"
          } >> "$GITHUB_STEP_SUMMARY"
          
      - name: Find exact kernel archive recursively in Drive
        id: kernel
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ROOT_FOLDER_ID: ${{ steps.folder.outputs.folder_id }}
          SPACECRAFT_BUILD_ID: ${{ steps.stockkernel.outputs.spacecraft_build_id }}
        run: |
          set -euo pipefail

          DRIVE_API="https://www.googleapis.com/drive/v3/files"
          FOLDER_MIME="application/vnd.google-apps.folder"
          EXPECTED_FILE="kernel-${KERNEL_FAMILY}-${SPACECRAFT_BUILD_ID}.tar.xz"
          RESULTS_FILE="$RUNNER_TEMP/drive-kernel-results.jsonl"

          rm -f "$RESULTS_FILE"
          touch "$RESULTS_FILE"

          echo "=== Recherche récursive Google Drive ==="
          echo "Dossier racine : $ROOT_FOLDER_ID"
          echo "Archive exacte : $EXPECTED_FILE"

          declare -a FOLDER_QUEUE=("$ROOT_FOLDER_ID")
          declare -A VISITED_FOLDERS=()

          while [ "${#FOLDER_QUEUE[@]}" -gt 0 ]; do
            CURRENT_FOLDER_ID="${FOLDER_QUEUE[0]}"
            FOLDER_QUEUE=("${FOLDER_QUEUE[@]:1}")

            if [ -n "${VISITED_FOLDERS[$CURRENT_FOLDER_ID]:-}" ]; then
              continue
            fi

            VISITED_FOLDERS["$CURRENT_FOLDER_ID"]=1
            PAGE_TOKEN=""

            echo "Exploration du dossier: $CURRENT_FOLDER_ID"

            while true; do
              QUERY="'${CURRENT_FOLDER_ID}' in parents and trashed=false"

              CURL_ARGS=(
                --silent
                --show-error
                --fail
                --get
                --header "Authorization: Bearer $ACCESS_TOKEN"
                --data-urlencode "q=$QUERY"
                --data-urlencode "pageSize=1000"
                --data-urlencode "supportsAllDrives=true"
                --data-urlencode "includeItemsFromAllDrives=true"
                --data-urlencode "fields=nextPageToken,files(id,name,mimeType,size,modifiedTime,parents)"
              )

              if [ -n "$PAGE_TOKEN" ]; then
                CURL_ARGS+=(--data-urlencode "pageToken=$PAGE_TOKEN")
              fi

              RESPONSE="$(curl "${CURL_ARGS[@]}" "$DRIVE_API")"

              API_ERROR="$(jq -r '.error.message // empty' <<< "$RESPONSE")"
              if [ -n "$API_ERROR" ]; then
                echo "::error::Google Drive API: $API_ERROR"
                exit 1
              fi

              while IFS= read -r ITEM; do
                ITEM_ID="$(jq -r '.id' <<< "$ITEM")"
                ITEM_NAME="$(jq -r '.name' <<< "$ITEM")"
                ITEM_MIME="$(jq -r '.mimeType' <<< "$ITEM")"

                echo "$ITEM_MIME  $ITEM_NAME"

                if [ "$ITEM_MIME" = "$FOLDER_MIME" ]; then
                  FOLDER_QUEUE+=("$ITEM_ID")
                elif [ "$ITEM_NAME" = "$EXPECTED_FILE" ]; then
                  printf '%s\n' "$ITEM" >> "$RESULTS_FILE"
                fi
              done < <(jq -c '.files[]' <<< "$RESPONSE")

              PAGE_TOKEN="$(jq -r '.nextPageToken // empty' <<< "$RESPONSE")"
              [ -n "$PAGE_TOKEN" ] || break
            done
          done

          MATCH_COUNT="$(wc -l < "$RESULTS_FILE" | tr -d '[:space:]')"

          if [ "$MATCH_COUNT" -eq 0 ]; then
            echo "::error::Archive exacte introuvable: $EXPECTED_FILE"
            echo "::error::Aucun fallback vers une autre révision n'est autorisé"
            exit 1
          fi

          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "::warning::$MATCH_COUNT copies trouvées; sélection de la plus récemment modifiée"
          fi

          FILE="$(
            jq -s -c 'sort_by(.modifiedTime) | reverse | .[0]' "$RESULTS_FILE"
          )"

          FILE_ID="$(jq -r '.id' <<< "$FILE")"
          FILE_NAME="$(jq -r '.name' <<< "$FILE")"
          FILE_SIZE="$(jq -r '.size // "inconnue"' <<< "$FILE")"
          FILE_DATE="$(jq -r '.modifiedTime // "inconnue"' <<< "$FILE")"

          {
            echo "file_id=$FILE_ID"
            echo "file_name=$FILE_NAME"
            echo "file_revision=$SPACECRAFT_BUILD_ID"
          } >> "$GITHUB_OUTPUT"

          echo "=== Archive sélectionnée ==="
          echo "Nom     : $FILE_NAME"
          echo "ID      : $FILE_ID"
          echo "Taille  : $FILE_SIZE"
          echo "Date    : $FILE_DATE"

          {
            echo "### Archive Drive sélectionnée"
            echo
            echo "- Archive: \`$FILE_NAME\`"
            echo "- Date Drive: \`$FILE_DATE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download selected kernel archive
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FILE_ID: ${{ steps.kernel.outputs.file_id }}
          FILE_NAME: ${{ steps.kernel.outputs.file_name }}
        run: |
          set -euo pipefail

          ARCHIVE="$WORKSPACE/src/$FILE_NAME"
          TEMP_ARCHIVE="${ARCHIVE}.part"

          if [ -s "$ARCHIVE" ]; then
            echo "=== Archive locale déjà présente ==="
            ls -lh "$ARCHIVE"

            if xz --test "$ARCHIVE"; then
              echo "Archive XZ locale valide"
              exit 0
            fi

            echo "::warning::Archive locale invalide, nouveau téléchargement"
            rm -f "$ARCHIVE"
          fi

          rm -f "$TEMP_ARCHIVE"

          curl --fail --location \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media&supportsAllDrives=true" \
            --output "$TEMP_ARCHIVE"

          test -s "$TEMP_ARCHIVE"
          file "$TEMP_ARCHIVE"
          xz --test "$TEMP_ARCHIVE"
          mv "$TEMP_ARCHIVE" "$ARCHIVE"

          echo "=== Archive prête ==="
          ls -lh "$ARCHIVE"

      - name: Cleanup old kernel archives
        shell: bash
        run: |
          set -euo pipefail

          find "$WORKSPACE/src" -maxdepth 1 -type f \
            \( -name 'kernel-*.tar.xz' -o -name 'kernels-*.tar.xz' \) \
            -mtime +90 -delete

          find "$WORKSPACE/src" -maxdepth 1 -type f -name '*.part' -delete
          ls -lh "$WORKSPACE/src"

      - name: Extract kernel sources
        id: extract
        shell: bash
        env:
          FILE_NAME: ${{ steps.kernel.outputs.file_name }}
        run: |
          set -euo pipefail

          ARCHIVE="$WORKSPACE/src/$FILE_NAME"
          test -s "$ARCHIVE"
          xz --test "$ARCHIVE"

          rm -rf "$WORKSPACE/build"
          mkdir -p "$WORKSPACE/build"

          echo "=== Contenu initial de l'archive ==="
          tar -tf "$ARCHIVE" | head -n 50 || true

          tar -xf "$ARCHIVE" -C "$WORKSPACE/build"
          echo "source_dir=$WORKSPACE/build" >> "$GITHUB_OUTPUT"
          du -sh "$WORKSPACE/build"

      - name: Inspect extracted sources
        shell: bash
        run: |
          set -euo pipefail

          echo "=== LEVEL 1 ==="
          find "$WORKSPACE/build" -mindepth 1 -maxdepth 1 -printf '%y %p\n' | sort
          echo "=== LEVEL 2 ==="
          find "$WORKSPACE/build" -mindepth 1 -maxdepth 2 -printf '%y %p\n' | sort | head -250
          echo "=== SIZE ==="
          du -sh "$WORKSPACE/build"/* 2>/dev/null | sort -h || true
          echo "=== KERNEL MARKERS ==="
          find "$WORKSPACE/build" -maxdepth 6 \
            \( -name BUILD.bazel -o -name WORKSPACE -o -name MODULE.bazel \
               -o -name build.config -o -name build.config.gki.aarch64 -o -name Makefile \) \
            -print | sort

      - name: Detect kernel root
        id: root
        shell: bash
        run: |
          set -euo pipefail

          GKI_ROOT="$(
            find "$WORKSPACE/build" -mindepth 2 -maxdepth 6 \
              -type d -path '*/common/gki' -print -quit
          )"

          if [ -z "$GKI_ROOT" ]; then
            echo "::error::Répertoire common/gki introuvable"
            find "$WORKSPACE/build" -mindepth 1 -maxdepth 4 -type d -print | sort | head -300
            exit 1
          fi

          KERNEL_ROOT="$(dirname "$(dirname "$GKI_ROOT")")"

          test -f "$GKI_ROOT/Makefile"
          test -f "$GKI_ROOT/BUILD.bazel"

          echo "kernel_root=$KERNEL_ROOT" >> "$GITHUB_OUTPUT"
          echo "gki_root=$GKI_ROOT" >> "$GITHUB_OUTPUT"
          echo "KERNEL_ROOT=$KERNEL_ROOT"
          echo "GKI_ROOT=$GKI_ROOT"

      - name: Detect Android KMI version
        id: kmi
        shell: bash
        env:
          KERNEL_ROOT: ${{ steps.root.outputs.kernel_root }}
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail

          KERNEL_VERSION="$(awk '$1 == "VERSION" && $2 == "=" { print $3; exit }' "$GKI_ROOT/Makefile")"
          KERNEL_PATCHLEVEL="$(awk '$1 == "PATCHLEVEL" && $2 == "=" { print $3; exit }' "$GKI_ROOT/Makefile")"
          KERNEL_SERIES="${KERNEL_VERSION}.${KERNEL_PATCHLEVEL}"

          KMI_STRING="$(
            grep -RhoE 'android[0-9]+-[0-9]+\.[0-9]+' \
              "$GKI_ROOT/BUILD.bazel" \
              "$GKI_ROOT"/build.config* \
              "$KERNEL_ROOT/MODULE.bazel" \
              "$KERNEL_ROOT/private/devices/google/spacecraft" \
              2>/dev/null |
            sort -u | head -n1 || true
          )"

          if [ -z "$KMI_STRING" ]; then
            echo "::error::Impossible de détecter le KMI Android"
            exit 1
          fi

          KMI_KERNEL_SERIES="${KMI_STRING#*-}"
          if [ "$KMI_KERNEL_SERIES" != "$KERNEL_SERIES" ]; then
            echo "::error::KMI $KMI_STRING incohérent avec le Makefile $KERNEL_SERIES"
            exit 1
          fi

          SUSFS_BRANCH="gki-${KMI_STRING}-dev"

          echo "kernel_series=$KERNEL_SERIES" >> "$GITHUB_OUTPUT"
          echo "kmi_string=$KMI_STRING" >> "$GITHUB_OUTPUT"
          echo "susfs_branch=$SUSFS_BRANCH" >> "$GITHUB_OUTPUT"

          echo "KERNEL_SERIES=$KERNEL_SERIES"
          echo "KMI_STRING=$KMI_STRING"
          echo "SUSFS_BRANCH=$SUSFS_BRANCH"

      - name: Spoof kernel metadata
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
          RELEASE_SUFFIX: ${{ steps.stockkernel.outputs.release_suffix }}
        run: |
          set -euo pipefail
          cd "$GKI_ROOT"

          sed -i "s/printf '%s' -dirty/printf '%s' ''/g" scripts/setlocalversion
          sed -i \
            "s#echo \"\${KERNELVERSION}\${file_localversion}\${config_localversion}\${LOCALVERSION}\${scm_version}\"#echo \"\${KERNELVERSION}${RELEASE_SUFFIX}\"#" \
            scripts/setlocalversion

      - name: Inject stock kernel build timestamp
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
          BUILD_TIMESTAMP: ${{ steps.stockkernel.outputs.build_timestamp }}
        run: |
          set -euo pipefail

          INIT_MAKEFILE="$GKI_ROOT/init/Makefile"
          TEMP_MAKEFILE="$INIT_MAKEFILE.tmp"
          test -s "$INIT_MAKEFILE"
          test -n "$BUILD_TIMESTAMP"

          grep -nF 'build-timestamp = $(or $(KBUILD_BUILD_TIMESTAMP), $(build-timestamp-auto))' "$INIT_MAKEFILE"

          awk -v timestamp="$BUILD_TIMESTAMP" '
            $0 == "build-timestamp = $(or $(KBUILD_BUILD_TIMESTAMP), $(build-timestamp-auto))" {
              print "build-timestamp = \"" timestamp "\""
              replaced++
              next
            }
            { print }
            END {
              if (replaced != 1) {
                print "Nombre de lignes remplacées incorrect: " replaced > "/dev/stderr"
                exit 42
              }
            }
          ' "$INIT_MAKEFILE" > "$TEMP_MAKEFILE"

          mv "$TEMP_MAKEFILE" "$INIT_MAKEFILE"
          EXPECTED_LINE="build-timestamp = \"$BUILD_TIMESTAMP\""
          grep -Fqx -- "$EXPECTED_LINE" "$INIT_MAKEFILE"

      - name: Install KernelSU-Next dev-susfs
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd "$GKI_ROOT"

          SETUP_SCRIPT="$WORKSPACE/tools/kernelsu-next-setup.sh"
          TEMP_FILE="${SETUP_SCRIPT}.tmp"

          mkdir -p "$WORKSPACE/tools"

          echo "=== Récupération du setup KernelSU-Next ==="

          rm -f "$TEMP_FILE"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output "$TEMP_FILE" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github.raw+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 10 \
              "https://api.github.com/repos/pershoot/KernelSU-Next/contents/kernel/setup.sh?ref=dev-susfs"
          )"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Impossible de récupérer setup.sh de KernelSU-Next"
            echo "HTTP_STATUS=$HTTP_STATUS"
            cat "$TEMP_FILE" || true
            exit 1
          fi

          if ! head -n1 "$TEMP_FILE" | grep -q '^#!'; then
            echo "::error::Le setup KernelSU-Next téléchargé n'est pas un script valide"
            head -n20 "$TEMP_FILE"
            exit 1
          fi

          mv "$TEMP_FILE" "$SETUP_SCRIPT"
          chmod +x "$SETUP_SCRIPT"

          echo
          echo "=== Installation KernelSU-Next ==="

          bash "$SETUP_SCRIPT" dev-susfs

          echo
          echo "=== Vérification ==="

          test -d KernelSU-Next
          test -L drivers/kernelsu

          git -C KernelSU-Next branch --show-current
          git -C KernelSU-Next log -1 --oneline

      - name: Verify KernelSU-Next installation
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail
          cd "$GKI_ROOT"
          git -C KernelSU-Next branch --show-current
          git -C KernelSU-Next log -1 --oneline
          test -L drivers/kernelsu
          ls -lah drivers/kernelsu

      - name: Clone matching SUSFS branch
        id: susfs
        shell: bash
        env:
          SUSFS_BRANCH: ${{ steps.kmi.outputs.susfs_branch }}
        run: |
          set -euo pipefail

          SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
          SUSFS_DIR="$WORKSPACE/susfs4ksu"

          git ls-remote --exit-code --heads "$SUSFS_REPO" "refs/heads/$SUSFS_BRANCH" >/dev/null || {
            echo "::error::Branche SUSFS absente: $SUSFS_BRANCH"
            exit 1
          }

          rm -rf "$SUSFS_DIR"
          git clone --depth 1 --single-branch --branch "$SUSFS_BRANCH" "$SUSFS_REPO" "$SUSFS_DIR"

          SUSFS_COMMIT="$(git -C "$SUSFS_DIR" rev-parse HEAD)"
          echo "susfs_dir=$SUSFS_DIR" >> "$GITHUB_OUTPUT"
          echo "susfs_commit=$SUSFS_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Integrate SUSFS into GKI kernel
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
          SUSFS_DIR: ${{ steps.susfs.outputs.susfs_dir }}
          KMI_STRING: ${{ steps.kmi.outputs.kmi_string }}
        run: |
          set -euo pipefail

          KERNEL_PATCH_SOURCE="$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-${KMI_STRING}.patch"

          test -s "$KERNEL_PATCH_SOURCE"
          test -d "$SUSFS_DIR/kernel_patches/fs"
          test -d "$SUSFS_DIR/kernel_patches/include/linux"

          cp -af "$SUSFS_DIR/kernel_patches/fs/." "$GKI_ROOT/fs/"
          cp -af "$SUSFS_DIR/kernel_patches/include/linux/." "$GKI_ROOT/include/linux/"

          find "$GKI_ROOT" -type f \( -name '*.rej' -o -name '*.orig' \) -delete

          cd "$GKI_ROOT"
          set +e
          patch --forward --batch -p1 < "$KERNEL_PATCH_SOURCE"
          PATCH_STATUS=$?
          set -e

          echo "PATCH_STATUS=$PATCH_STATUS"
          if [ "$PATCH_STATUS" -ne 0 ]; then
            echo "::warning::Hunks incompatibles; application du fixup Spacecraft ensuite"
          fi

          find "$GKI_ROOT" -type f -name '*.rej' -print -exec cat {} \; || true

      - name: Apply Spacecraft SUSFS fixups
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail

          FIXUP_PATCH="$GITHUB_WORKSPACE/patches/0001-spacecraft-16238327-susfs-fixups.patch"
          test -s "$FIXUP_PATCH"
          cd "$GKI_ROOT"

          patch --dry-run --forward --batch -p1 < "$FIXUP_PATCH"
          patch --forward --batch -p1 < "$FIXUP_PATCH"

          rm -f fs/exec.c.rej fs/proc/task_mmu.c.rej

          REMAINING_REJECTS="$(find "$GKI_ROOT" -type f -name '*.rej' -print)"
          if [ -n "$REMAINING_REJECTS" ]; then
            echo "::error::Rejets SUSFS restants:"
            echo "$REMAINING_REJECTS"
            exit 1
          fi

          test -s fs/susfs.c
          test -s include/linux/susfs.h

      - name: Verify SUSFS kernel integration
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail
          cd "$GKI_ROOT"

          grep -n -E 'susfs(\.o)?' fs/Makefile || {
            echo "::error::SUSFS absent de fs/Makefile"
            tail -n 80 fs/Makefile
            exit 1
          }

          grep -q 'KSU_SUSFS' KernelSU-Next/kernel/Kconfig || {
            echo "::error::KSU_SUSFS absent du Kconfig KernelSU-Next"
            exit 1
          }

          grep -R -q 'linux/susfs\.h' KernelSU-Next/kernel || {
            echo "::error::KernelSU-Next ne référence pas linux/susfs.h"
            exit 1
          }

          test -s include/linux/susfs.h
          test -s fs/susfs.c
          echo "Intégration SUSFS validée"

      - name: Disable protected modules
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail
          cd "$GKI_ROOT"
          patch --forward --batch -p1 \
            < "$GITHUB_WORKSPACE/patches/0002-disable-protected-modules.patch"

      - name: Extract stock defconfig from boot.img
        id: stockdefconfig
        shell: bash
        env:
          BOOT_IMG: ${{ steps.ota.outputs.boot_img }}
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail

          MAGISKBOOT="$WORKSPACE/tools/magiskboot"
          EXTRACT_IKCONFIG="$WORKSPACE/tools/extract-ikconfig"

          rm -rf "$WORKSPACE/stockconfig"
          mkdir -p "$WORKSPACE/stockconfig"
          cd "$WORKSPACE/stockconfig"

          "$MAGISKBOOT" unpack "$BOOT_IMG"
          test -f kernel
          "$EXTRACT_IKCONFIG" kernel > stock_defconfig
          test -s stock_defconfig

          mkdir -p "$GKI_ROOT/arch/arm64/configs"
          cp stock_defconfig "$GKI_ROOT/arch/arm64/configs/stock_defconfig"

      - name: Spoof /proc/config.gz with stock defconfig
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail

          KERNEL_MAKEFILE="$GKI_ROOT/kernel/Makefile"
          test -s "$GKI_ROOT/arch/arm64/configs/stock_defconfig"

          sed -i \
            's#$(obj)/config_data: $(KCONFIG_CONFIG) FORCE#$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE#' \
            "$KERNEL_MAKEFILE"

          grep -q '$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE' "$KERNEL_MAKEFILE"

      - name: Install nomount built-in
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd "$GKI_ROOT"

          SETUP_SCRIPT="$WORKSPACE/tools/nomount-setup.sh"
          TEMP_FILE="${SETUP_SCRIPT}.tmp"

          mkdir -p "$WORKSPACE/tools"
          rm -f "$TEMP_FILE"

          echo "=== Récupération du setup nomount ==="

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output "$TEMP_FILE" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github.raw+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 10 \
              "https://api.github.com/repos/maxsteeel/nomount/contents/kernel/setup.sh?ref=dev"
          )"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Impossible de récupérer setup.sh de nomount"
            echo "HTTP_STATUS=$HTTP_STATUS"
            cat "$TEMP_FILE" || true
            exit 1
          fi

          echo
          echo "=== Validation du script ==="

          if ! head -n1 "$TEMP_FILE" | grep -q '^#!'; then
            echo "::error::Le setup nomount téléchargé n'est pas valide"
            head -n20 "$TEMP_FILE"
            exit 1
          fi

          mv "$TEMP_FILE" "$SETUP_SCRIPT"
          chmod +x "$SETUP_SCRIPT"

          echo
          echo "=== Application de nomount ==="

          bash "$SETUP_SCRIPT"

          echo
          echo "=== Vérification de l'intégration ==="

          test -L fs/nomount
          test -f fs/nomount/Kconfig
          test -f fs/nomount/Makefile

          grep -q \
            'source "fs/nomount/Kconfig"' \
            fs/Kconfig

          grep -q \
            'obj-$(CONFIG_NOMOUNT) += nomount/' \
            fs/Makefile

          grep -q \
            '^config NOMOUNT' \
            fs/nomount/Kconfig

          grep -q \
            '^[[:space:]]*default y' \
            fs/nomount/Kconfig

          echo
          echo "=== Kconfig NoMount ==="
          cat fs/nomount/Kconfig

          echo
          echo "=== NoMount validé ==="
          echo "CONFIG_NOMOUNT=y"
          
      - name: Build GKI from sources
        shell: bash
        env:
          KERNEL_ROOT: ${{ steps.root.outputs.kernel_root }}
          KBUILD_BUILD_USER: kleaf
          KBUILD_BUILD_HOST: build-host
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"

          grep -nF 'build-timestamp =' common/gki/init/Makefile

          time tools/bazel build \
            --config=spacecraft \
            --strategy=KernelBuild=local \
            "--action_env=KBUILD_BUILD_USER=$KBUILD_BUILD_USER" \
            "--action_env=KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST" \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --//common:kernel_package_use_prebuilt_kernel=false \
            //common/gki:kernel_aarch64

      - name: Verify compiled kernel metadata
        shell: bash
        env:
          KERNEL_ROOT: ${{ steps.root.outputs.kernel_root }}
          EXPECTED_TIMESTAMP: ${{ steps.stockkernel.outputs.build_timestamp }}
          EXPECTED_RELEASE_SUFFIX: ${{ steps.stockkernel.outputs.release_suffix }}
          GKI_BUILD_ID: ${{ steps.stockkernel.outputs.gki_build_id }}
        run: |
          set -euo pipefail

          VMLINUX="$KERNEL_ROOT/bazel-bin/common/gki/kernel_aarch64/vmlinux"
          test -s "$VMLINUX"

          LINUX_VERSION="$(strings "$VMLINUX" | grep -a -m1 '^Linux version ')"
          PREEMPT_LINE="$(strings "$VMLINUX" | grep -a -m1 '^#1 SMP PREEMPT ')"

          echo "LINUX_VERSION=$LINUX_VERSION"
          echo "PREEMPT_LINE=$PREEMPT_LINE"

          grep -Fq -- "$EXPECTED_RELEASE_SUFFIX" <<< "$LINUX_VERSION"
          grep -Fq -- "-ab${GKI_BUILD_ID}" <<< "$LINUX_VERSION"
          grep -Fq -- '(kleaf@build-host)' <<< "$LINUX_VERSION"

          EXPECTED_PREEMPT="#1 SMP PREEMPT $EXPECTED_TIMESTAMP"
          if [ "$PREEMPT_LINE" != "$EXPECTED_PREEMPT" ]; then
            echo "::error::Timestamp kernel incorrect"
            echo "Attendu: $EXPECTED_PREEMPT"
            echo "Obtenu : $PREEMPT_LINE"
            exit 1
          fi

      - name: Gather versions
        id: versions
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
          SUSFS_DIR: ${{ steps.susfs.outputs.susfs_dir }}
        run: |
          set -euo pipefail

          KSU_VERSION="$(git -C "$GKI_ROOT/KernelSU-Next" rev-list --count HEAD)"
          KSU_VERSION=$((30000 + KSU_VERSION))

          git -C "$SUSFS_DIR" fetch --tags >/dev/null 2>&1 || true
          SUSFS_VERSION="$(git -C "$SUSFS_DIR" describe --tags --abbrev=0 2>/dev/null || true)"

          if [ -z "$SUSFS_VERSION" ]; then
            SUSFS_VERSION="$(grep -RhoE 'v[0-9]+\.[0-9]+\.[0-9]+' "$SUSFS_DIR" | sort -Vu | tail -n1 || true)"
          fi

          if [ -z "$SUSFS_VERSION" ]; then
            SUSFS_VERSION="git-$(git -C "$SUSFS_DIR" rev-parse --short HEAD)"
          fi

          echo "ksu_version=$KSU_VERSION" >> "$GITHUB_OUTPUT"
          echo "susfs_version=$SUSFS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract SPL from boot image
        id: spl
        shell: bash
        env:
          BOOT_IMG: ${{ steps.ota.outputs.boot_img }}
        run: |
          set -euo pipefail

          SPL="$(
            strings "$BOOT_IMG" |
            awk '/com.android.build.boot.security_patch/ { getline; print; exit }'
          )"

          if [ -z "$SPL" ]; then
            echo "::error::Impossible d'extraire le SPL"
            exit 1
          fi

          echo "spl=$SPL" >> "$GITHUB_OUTPUT"
          echo "SPL=$SPL"

      - name: Repack boot image
        id: repack
        shell: bash
        env:
          BOOT_IMG: ${{ steps.ota.outputs.boot_img }}
          KSU_VERSION: ${{ steps.versions.outputs.ksu_version }}
          SUSFS_VERSION: ${{ steps.versions.outputs.susfs_version }}
          SPL: ${{ steps.spl.outputs.spl }}
          KERNEL_ROOT: ${{ steps.root.outputs.kernel_root }}
          KERNEL_BUILD_ID: ${{ steps.stockkernel.outputs.gki_build_id }}
        run: |
          set -euo pipefail

          MAGISKBOOT="$WORKSPACE/tools/magiskboot"
          REPACK_DIR="$WORKSPACE/dist/repack"

          rm -rf "$REPACK_DIR"
          mkdir -p "$REPACK_DIR"
          cd "$REPACK_DIR"

          cp "$BOOT_IMG" boot.img
          "$MAGISKBOOT" unpack boot.img

          cp "$KERNEL_ROOT/bazel-bin/common/gki/kernel_aarch64/Image.lz4" kernel
          "$MAGISKBOOT" repack boot.img

          FINAL_NAME="${SPL}_ab${KERNEL_BUILD_ID}_boot_KSUNext_${KSU_VERSION}_SUSFS_${SUSFS_VERSION}.img"
          mv new-boot.img "$WORKSPACE/dist/$FINAL_NAME"

          echo "artifact=$WORKSPACE/dist/$FINAL_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$WORKSPACE/dist/$FINAL_NAME"

      - name: Create unified kernel artifact
        shell: bash
        env:
          OTA_URL: ${{ inputs.ota_url }}
          SPL: ${{ steps.spl.outputs.spl }}
          GKI_BUILD_ID: ${{ steps.stockkernel.outputs.gki_build_id }}
          SPACECRAFT_BUILD_ID: ${{ steps.stockkernel.outputs.spacecraft_build_id }}
          BOOTLOADER_VERSION: ${{ steps.stockkernel.outputs.bootloader_version }}
          KERNEL_ARCHIVE: ${{ steps.kernel.outputs.file_name }}
          KSU_VERSION: ${{ steps.versions.outputs.ksu_version }}
          SUSFS_VERSION: ${{ steps.versions.outputs.susfs_version }}
          SOURCE_IMAGE: ${{ steps.repack.outputs.artifact }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="$WORKSPACE/dist/package"
          PATCHED_IMAGE="$PACKAGE_DIR/patched-image.img"
          META_JSON="$PACKAGE_DIR/build-metadata.json"

          test -s "$SOURCE_IMAGE"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          cp "$SOURCE_IMAGE" "$PATCHED_IMAGE"

          BUILD_REVISION="$(date -u +%Y%m%d%H%M)"
          SOURCE_BASENAME="$(basename "$SOURCE_IMAGE")"

          VERSION_CODE="$(
            strings "$SOURCE_IMAGE" \
              | grep -a 'user/release-keys' \
              | head -n1 \
              | sed -n 's#.*\/\([0-9]\+\):user/release-keys#\1#p' \
              || true
          )"

          jq -n \
            --arg mode "kernel" \
            --arg image_type "boot" \
            --arg image_filename "patched-image.img" \
            --arg source_image_filename "$SOURCE_BASENAME" \
            --arg ota_url "$OTA_URL" \
            --arg spl "$SPL" \
            --arg version_code "$VERSION_CODE" \
            --arg gki_build_id "$GKI_BUILD_ID" \
            --arg spacecraft_build_id "$SPACECRAFT_BUILD_ID" \
            --arg bootloader_version "$BOOTLOADER_VERSION" \
            --arg kernel_archive "$KERNEL_ARCHIVE" \
            --arg ksu_version "$KSU_VERSION" \
            --arg susfs_version "$SUSFS_VERSION" \
            --arg build_revision "$BUILD_REVISION" \
            '{
              mode: $mode,
              image_type: $image_type,
              image_filename: $image_filename,
              boot_filename: $image_filename,
              source_image_filename: $source_image_filename,
              ota_url: $ota_url,
              spl: $spl,
              version_code: $version_code,
              gki_build_id: $gki_build_id,
              spacecraft_build_id: $spacecraft_build_id,
              bootloader_version: $bootloader_version,
              kernel_archive: $kernel_archive,
              ksu_version: $ksu_version,
              susfs_version: $susfs_version,
              nomount: true,
              build_revision: $build_revision
            }' > "$META_JSON"

          test -s "$PATCHED_IMAGE"
          jq empty "$META_JSON"
          sha256sum "$PATCHED_IMAGE"
          jq . "$META_JSON"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: /home/aurelien/workspace/dist/package/
          if-no-files-found: error
          retention-days: 30

  init-boot-patch:
    if: inputs.drive_folder_url == ''
    runs-on:
      - self-hosted
      - Linux
      - X64
      - android-worker
    timeout-minutes: 60
    env:
      WORKSPACE: /home/aurelien/workspace

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install payload-dumper
        shell: bash
        run: |
          set -euo pipefail

          TOOLS_DIR="$WORKSPACE/tools"
          UV_BIN="$TOOLS_DIR/uv"
          PAYLOAD_VENV="$TOOLS_DIR/payload-dumper-venv"

          if [ ! -x "$UV_BIN" ]; then
            UV_INSTALL_DIR="$TOOLS_DIR/uv-install"
            rm -rf "$UV_INSTALL_DIR"
            mkdir -p "$UV_INSTALL_DIR"

            curl --fail --location --silent --show-error               "https://astral.sh/uv/install.sh"               --output "$TOOLS_DIR/install-uv.sh"

            env UV_INSTALL_DIR="$UV_INSTALL_DIR" UV_NO_MODIFY_PATH=1               sh "$TOOLS_DIR/install-uv.sh"

            UV_FOUND="$(find "$UV_INSTALL_DIR" -type f -name uv -perm -u+x -print -quit)"
            test -n "$UV_FOUND"
            cp "$UV_FOUND" "$UV_BIN"
            chmod +x "$UV_BIN"
            rm -rf "$UV_INSTALL_DIR" "$TOOLS_DIR/install-uv.sh"
          fi

          if [ ! -x "$PAYLOAD_VENV/bin/python" ]; then
            rm -rf "$PAYLOAD_VENV"
            "$UV_BIN" venv --python python3 "$PAYLOAD_VENV"
          fi

          "$UV_BIN" pip install             --python "$PAYLOAD_VENV/bin/python"             --upgrade             "git+https://github.com/5ec1cff/payload-dumper.git"

          test -x "$PAYLOAD_VENV/bin/payload_dumper"

      - name: Extract boot and init_boot from OTA
        id: ota
        shell: bash
        env:
          OTA_URL: ${{ inputs.ota_url }}
        run: |
          set -euo pipefail

          PAYLOAD_DUMPER="$WORKSPACE/tools/payload-dumper-venv/bin/payload_dumper"
          OTA_DIR="$WORKSPACE/ota-initboot"

          case "$OTA_URL" in
            http://*|https://*)
              ;;
            *)
              echo "::error::URL OTA invalide : $OTA_URL"
              exit 1
              ;;
          esac

          if [ ! -x "$PAYLOAD_DUMPER" ]; then
            echo "::error::payload_dumper introuvable : $PAYLOAD_DUMPER"
            exit 1
          fi

          rm -rf "$OTA_DIR"
          mkdir -p "$OTA_DIR"
          cd "$OTA_DIR"

          echo "=== Extraction de boot et init_boot ==="

          "$PAYLOAD_DUMPER" \
            --partitions boot,init_boot \
            "$OTA_URL"

          BOOT_IMG="$OTA_DIR/output/boot.img"
          INIT_BOOT_IMG="$OTA_DIR/output/init_boot.img"

          if [ ! -s "$BOOT_IMG" ]; then
            echo "::error::boot.img absent après extraction"
            find "$OTA_DIR" -maxdepth 3 -type f -ls || true
            exit 1
          fi

          if [ ! -s "$INIT_BOOT_IMG" ]; then
            echo "::error::init_boot.img absent après extraction"
            find "$OTA_DIR" -maxdepth 3 -type f -ls || true
            exit 1
          fi

          echo
          echo "=== Images extraites ==="

          ls -lh "$BOOT_IMG" "$INIT_BOOT_IMG"
          file "$BOOT_IMG" "$INIT_BOOT_IMG"

          echo
          echo "=== Détection de la version du kernel ==="

          KERNEL_RELEASE="$(
            strings "$BOOT_IMG" \
              | grep -aoE 'Linux version [0-9]+\.[0-9]+\.[0-9]+-android[0-9]+-[0-9]+-g[0-9a-f]+-ab[0-9]+-4k' \
              | head -n1 \
              | sed 's/^Linux version //' \
              || true
          )"

          if [ -z "$KERNEL_RELEASE" ]; then
            echo "::error::Version du kernel introuvable dans boot.img"

            strings "$BOOT_IMG" \
              | grep -a -m20 -E 'Linux version|android[0-9]+|PREEMPT|kleaf|ab[0-9]+' \
              || true

            exit 1
          fi

          KERNEL_SERIES="$(
            printf '%s\n' "$KERNEL_RELEASE" \
              | grep -aoE '^[0-9]+\.[0-9]+' \
              | head -n1 \
              || true
          )"

          ANDROID_VERSION="$(
            printf '%s\n' "$KERNEL_RELEASE" \
              | grep -aoE 'android[0-9]+' \
              | head -n1 \
              || true
          )"

          ANDROID_KMI="$(
            printf '%s\n' "$KERNEL_RELEASE" \
              | grep -aoE 'android[0-9]+-[0-9]+' \
              | head -n1 \
              || true
          )"

          GKI_BUILD_ID="$(
            printf '%s\n' "$KERNEL_RELEASE" \
              | grep -aoE 'ab[0-9]+' \
              | head -n1 \
              | sed 's/^ab//' \
              || true
          )"

          if [ -z "$KERNEL_SERIES" ]; then
            echo "::error::Série kernel introuvable : $KERNEL_RELEASE"
            exit 1
          fi

          if [ -z "$ANDROID_VERSION" ]; then
            echo "::error::Version Android introuvable : $KERNEL_RELEASE"
            exit 1
          fi

          if [ -z "$ANDROID_KMI" ]; then
            echo "::error::Android KMI introuvable : $KERNEL_RELEASE"
            exit 1
          fi

          if [ -z "$GKI_BUILD_ID" ]; then
            echo "::error::GKI Build ID introuvable : $KERNEL_RELEASE"
            exit 1
          fi

          #
          # KMI attendu par ksud :
          # 6.12-android16-6
          #
          KMI="${KERNEL_SERIES}-${ANDROID_KMI}"

          #
          # Convention des assets KernelSU-Next :
          # aarch64_android16-6.12_kernelsu.ko
          #
          LKM_ID="${ANDROID_VERSION}-${KERNEL_SERIES}"
          LKM_ASSET="aarch64_${LKM_ID}_kernelsu.ko"

          OTA_URL_NO_QUERY="${OTA_URL%%\?*}"
          OTA_FILENAME="${OTA_URL_NO_QUERY##*/}"

          BUILD_DATE_SHORT="$(
            printf '%s\n' "$OTA_FILENAME" \
              | grep -aoE '[0-9]{6}' \
              | head -n1 \
              || true
          )"

          if ! printf '%s' "$BUILD_DATE_SHORT" | grep -Eq '^[0-9]{6}$'; then
            echo "::error::Date YYMMDD introuvable dans le nom OTA : $OTA_FILENAME"
            exit 1
          fi

          SPL="20${BUILD_DATE_SHORT:0:2}-${BUILD_DATE_SHORT:2:2}-${BUILD_DATE_SHORT:4:2}"

          echo
          echo "========================================"
          echo "MÉTADONNÉES DU MODE LKM"
          echo "========================================"
          echo "OTA_FILENAME=$OTA_FILENAME"
          echo "SPL=$SPL"
          echo "KERNEL_RELEASE=$KERNEL_RELEASE"
          echo "KERNEL_SERIES=$KERNEL_SERIES"
          echo "ANDROID_VERSION=$ANDROID_VERSION"
          echo "ANDROID_KMI=$ANDROID_KMI"
          echo "GKI_BUILD_ID=$GKI_BUILD_ID"
          echo "KMI=$KMI"
          echo "LKM_ID=$LKM_ID"
          echo "LKM_ASSET=$LKM_ASSET"

          {
            echo "boot_img=$BOOT_IMG"
            echo "init_boot_img=$INIT_BOOT_IMG"
            echo "ota_filename=$OTA_FILENAME"
            echo "spl=$SPL"
            echo "kernel_release=$KERNEL_RELEASE"
            echo "kernel_series=$KERNEL_SERIES"
            echo "android_version=$ANDROID_VERSION"
            echo "android_kmi=$ANDROID_KMI"
            echo "gki_build_id=$GKI_BUILD_ID"
            echo "kmi=$KMI"
            echo "lkm_id=$LKM_ID"
            echo "lkm_asset=$LKM_ASSET"
          } >> "$GITHUB_OUTPUT"

      - name: Install KernelSU-Next v3.4.2 ksud and LKM
        id: ksunext
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KSU_VERSION: "v3.4.2"
          KSUD_ASSET: "ksud-x86_64-unknown-linux-musl"
          LKM_ASSET: ${{ steps.ota.outputs.lkm_asset }}
        run: |
          set -euo pipefail

          TOOLS_DIR="$WORKSPACE/tools/ksunext"
          RELEASE_JSON="$RUNNER_TEMP/ksunext-v3.4.2.json"

          rm -rf "$TOOLS_DIR"
          mkdir -p "$TOOLS_DIR"

          echo "=== KernelSU-Next $KSU_VERSION ==="
          echo "KSUD_ASSET=$KSUD_ASSET"
          echo "LKM_ASSET=$LKM_ASSET"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/tags/${KSU_VERSION}" \
            --output "$RELEASE_JSON"

          ACTUAL_TAG="$(jq -r '.tag_name // empty' "$RELEASE_JSON")"

          if [ "$ACTUAL_TAG" != "$KSU_VERSION" ]; then
            echo "::error::Release incorrect. Attendu=$KSU_VERSION Obtenu=$ACTUAL_TAG"
            exit 1
          fi

          KSUD_URL="$(jq -r --arg name "$KSUD_ASSET" '.assets[] | select(.name == $name) | .browser_download_url' "$RELEASE_JSON")"
          LKM_URL="$(jq -r --arg name "$LKM_ASSET" '.assets[] | select(.name == $name) | .browser_download_url' "$RELEASE_JSON")"

          if [ -z "$KSUD_URL" ]; then
            echo "::error::Asset ksud absent : $KSUD_ASSET"
            jq -r '.assets[].name' "$RELEASE_JSON"
            exit 1
          fi

          if [ -z "$LKM_URL" ]; then
            echo "::error::Asset LKM absent : $LKM_ASSET"
            jq -r '.assets[].name' "$RELEASE_JSON"
            exit 1
          fi

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$KSUD_URL" \
            --output "$TOOLS_DIR/ksud"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$LKM_URL" \
            --output "$TOOLS_DIR/kernelsu.ko"

          test -s "$TOOLS_DIR/ksud"
          test -s "$TOOLS_DIR/kernelsu.ko"
          chmod 700 "$TOOLS_DIR/ksud"

          echo "=== Vérification ksud ==="
          file "$TOOLS_DIR/ksud"
          "$TOOLS_DIR/ksud" --version

          echo "=== Vérification LKM ==="
          ls -lh "$TOOLS_DIR/kernelsu.ko"
          file "$TOOLS_DIR/kernelsu.ko"

          KSUD_SHA256="$(sha256sum "$TOOLS_DIR/ksud" | awk '{print $1}')"
          LKM_SHA256="$(sha256sum "$TOOLS_DIR/kernelsu.ko" | awk '{print $1}')"

          echo "KSUD_SHA256=$KSUD_SHA256"
          echo "LKM_SHA256=$LKM_SHA256"

          echo "=== Interface boot-patch ==="
          "$TOOLS_DIR/ksud" boot-patch --help

          {
            echo "release_tag=$ACTUAL_TAG"
            echo "ksud=$TOOLS_DIR/ksud"
            echo "ksud_asset=$KSUD_ASSET"
            echo "ksud_sha256=$KSUD_SHA256"
            echo "module=$TOOLS_DIR/kernelsu.ko"
            echo "module_asset=$LKM_ASSET"
            echo "module_sha256=$LKM_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Patch init_boot with KernelSU-Next
        id: patch
        shell: bash
        env:
          KSUD_BIN: ${{ steps.ksunext.outputs.ksud }}
          KSU_MODULE: ${{ steps.ksunext.outputs.module }}
          INIT_BOOT_IMG: ${{ steps.ota.outputs.init_boot_img }}
          KMI: ${{ steps.ota.outputs.kmi }}
        run: |
          set -euo pipefail

          PATCH_DIR="$WORKSPACE/dist/init-boot-patch"
          OUTPUT_NAME="init_boot-patched.img"
          OUTPUT_IMG="$PATCH_DIR/$OUTPUT_NAME"

          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"

          echo "=== KernelSU-Next LKM patch ==="
          echo "init_boot : $INIT_BOOT_IMG"
          echo "LKM       : $KSU_MODULE"
          echo "KMI       : $KMI"
          echo "Output    : $OUTPUT_IMG"

          "$KSUD_BIN" boot-patch \
            --boot "$INIT_BOOT_IMG" \
            --module "$KSU_MODULE" \
            --kmi "$KMI" \
            --out "$PATCH_DIR" \
            --out-name "$OUTPUT_NAME"

          if [ ! -s "$OUTPUT_IMG" ]; then
            echo "::error::init_boot patché non généré"

            find "$PATCH_DIR" \
              -maxdepth 2 \
              -type f \
              -ls \
              || true

            exit 1
          fi

          echo
          echo "=== init_boot KernelSU-Next généré ==="

          ls -lh "$OUTPUT_IMG"
          file "$OUTPUT_IMG"
          sha256sum "$OUTPUT_IMG"

          echo "patched_image=$OUTPUT_IMG" >> "$GITHUB_OUTPUT"


      - name: Create unified init_boot artifact
        shell: bash
        env:
          OTA_URL: ${{ inputs.ota_url }}
          SOURCE_IMAGE: ${{ steps.patch.outputs.patched_image }}
          SPL: ${{ steps.ota.outputs.spl }}
          KSU_RELEASE: ${{ steps.ksunext.outputs.release_tag }}
          KSUD_ASSET: ${{ steps.ksunext.outputs.ksud_asset }}
          KSUD_SHA256: ${{ steps.ksunext.outputs.ksud_sha256 }}
          KSU_MODULE_ASSET: ${{ steps.ksunext.outputs.module_asset }}
          KSU_MODULE_SHA256: ${{ steps.ksunext.outputs.module_sha256 }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="$WORKSPACE/dist/package"
          PATCHED_IMAGE="$PACKAGE_DIR/patched-image.img"
          META_JSON="$PACKAGE_DIR/build-metadata.json"

          test -s "$SOURCE_IMAGE"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          cp "$SOURCE_IMAGE" "$PATCHED_IMAGE"

          BUILD_REVISION="$(date -u +%Y%m%d%H%M)"

          jq -n \
            --arg mode "init_boot" \
            --arg image_type "init_boot" \
            --arg image_filename "patched-image.img" \
            --arg ota_url "$OTA_URL" \
            --arg spl "$SPL" \
            --arg version_code "" \
            --arg ksu_version "$KSU_RELEASE" \
            --arg ksud_asset "$KSUD_ASSET" \
            --arg ksud_sha256 "$KSUD_SHA256" \
            --arg module_asset "$KSU_MODULE_ASSET" \
            --arg module_sha256 "$KSU_MODULE_SHA256" \
            --arg build_revision "$BUILD_REVISION" \
            '{
              mode: $mode,
              image_type: $image_type,
              image_filename: $image_filename,
              boot_filename: $image_filename,
              ota_url: $ota_url,
              spl: $spl,
              version_code: $version_code,
              kernel_archive: null,
              ksu_version: $ksu_version,
              ksud_asset: $ksud_asset,
              ksud_sha256: $ksud_sha256,
              ksu_module_asset: $module_asset,
              ksu_module_sha256: $module_sha256,
              susfs_version: "none",
              nomount: false,
              build_revision: $build_revision
            }' > "$META_JSON"

          test -s "$PATCHED_IMAGE"
          jq empty "$META_JSON"
          sha256sum "$PATCHED_IMAGE"
          jq . "$META_JSON"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: /home/aurelien/workspace/dist/package/
          if-no-files-found: error
          retention-days: 30
