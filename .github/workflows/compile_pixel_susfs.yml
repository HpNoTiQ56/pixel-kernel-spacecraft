      - name: Debug init timestamp
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail

          grep -n "build-timestamp" \
            "$GKI_ROOT/init/Makefile"

          echo
          echo "=== SOURCE_DATE_EPOCH refs ==="

          grep -R "SOURCE_DATE_EPOCH" \
            "$GKI_ROOT" \
            2>/dev/null | head -50 || true
            
      - name: Build GKI from sources
        shell: bash
        env:
          KERNEL_ROOT: ${{ steps.root.outputs.kernel_root }}
          KBUILD_BUILD_USER: kleaf
          KBUILD_BUILD_HOST: build-host
        run: |
          set -euo pipefail

          cd "$KERNEL_ROOT"

          echo "=== Racine Spacecraft ==="
          pwd

          echo
          # echo "=== KernelSU-Next ==="
          # git -C common/gki/KernelSU-Next branch --show-current
          # git -C common/gki/KernelSU-Next log -1 --oneline
          # git -C common/gki/KernelSU-Next describe --tags --always

          echo
          echo "=== Métadonnées de compilation ==="
          echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER"
          echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST"

          echo
          echo "=== Timestamp injecté dans init/Makefile ==="

          grep -nF \
            'build-timestamp =' \
            common/gki/init/Makefile

          echo
          echo "=== Compilation GKI depuis les sources ==="

          time tools/bazel build \
            --config=spacecraft \
            --strategy=KernelBuild=local \
            "--action_env=KBUILD_BUILD_USER=$KBUILD_BUILD_USER" \
            "--action_env=KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST" \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --//common:kernel_package_use_prebuilt_kernel=false \
            //common/gki:kernel_aarch64
            
      - name: Verify compiled kernel metadata
        shell: bash
        env:
          KERNEL_ROOT: ${{ steps.root.outputs.kernel_root }}
          EXPECTED_TIMESTAMP: ${{ steps.stockkernel.outputs.build_timestamp }}
          EXPECTED_RELEASE_SUFFIX: ${{ steps.stockkernel.outputs.release_suffix }}
        run: |
          set -euo pipefail

          VMLINUX="$KERNEL_ROOT/bazel-bin/common/gki/kernel_aarch64/vmlinux"

          test -s "$VMLINUX"

          LINUX_VERSION="$(
            strings "$VMLINUX" \
              | grep -a -m1 '^Linux version '
          )"

          PREEMPT_LINE="$(
            strings "$VMLINUX" \
              | grep -a -m1 '^#1 SMP PREEMPT '
          )"

          echo "=== Métadonnées du kernel compilé ==="
          echo "LINUX_VERSION=$LINUX_VERSION"
          echo "PREEMPT_LINE=$PREEMPT_LINE"

          echo
          echo "=== Valeurs attendues ==="
          echo "EXPECTED_RELEASE_SUFFIX=$EXPECTED_RELEASE_SUFFIX"
          echo "EXPECTED_TIMESTAMP=$EXPECTED_TIMESTAMP"

          if ! grep -Fq \
            -- "$EXPECTED_RELEASE_SUFFIX" \
            <<< "$LINUX_VERSION"
          then
            echo "::error::Le suffixe kernel stock n'est pas présent"
            echo "Attendu : $EXPECTED_RELEASE_SUFFIX"
            echo "Obtenu  : $LINUX_VERSION"
            exit 1
          fi

          if ! grep -Fq \
            -- '(kleaf@build-host)' \
            <<< "$LINUX_VERSION"
          then
            echo "::error::Le couple kleaf@build-host n'est pas présent"
            echo "Obtenu : $LINUX_VERSION"
            exit 1
          fi

          EXPECTED_PREEMPT="#1 SMP PREEMPT $EXPECTED_TIMESTAMP"

          if [ "$PREEMPT_LINE" != "$EXPECTED_PREEMPT" ]; then
            echo "::error::Timestamp kernel incorrect"
            echo "Attendu : $EXPECTED_PREEMPT"
            echo "Obtenu  : $PREEMPT_LINE"
            exit 1
          fi

          echo
          echo "=== Métadonnées kernel validées ==="
          
