name: Download latest Kernel Sources

on:
  workflow_dispatch:
    inputs:
      drive_folder_url:
        description: "Lien du dossier Google Drive contenant kernels-*.tar.xz"
        required: true
        type: string

jobs:
  download-and-extract:

    runs-on:
      - self-hosted
      - Linux
      - X64
      - android-worker

    timeout-minutes: 60

    env:
      WORKSPACE: /home/aurelien/workspace

    steps:

      - name: Verify runner
        shell: bash
        run: |
          set -euo pipefail

          echo "=== HOST ==="
          hostname

          echo "=== USER ==="
          whoami

          echo "=== PWD ==="
          pwd

          mkdir -p "$WORKSPACE/src"
          mkdir -p "$WORKSPACE/build"
          mkdir -p "$WORKSPACE/dist"

          echo
          echo "=== WORKSPACE ==="
          ls -lah "$WORKSPACE"

          echo
          echo "=== DISK ==="
          df -h

      - name: Extract folder ID
        id: folder
        shell: bash
        env:
          DRIVE_FOLDER_URL: ${{ inputs.drive_folder_url }}
        run: |
          set -euo pipefail

          FOLDER_ID="$(
            printf '%s' "$DRIVE_FOLDER_URL" |
            sed -nE 's#.*(/folders/|[?&]id=)([^/?&]+).*#\2#p'
          )"

          if [ -z "$FOLDER_ID" ]; then
            echo "::error::Impossible d'extraire l'ID du dossier Google Drive"
            exit 1
          fi

          echo "folder_id=$FOLDER_ID" >> "$GITHUB_OUTPUT"

          echo "Folder ID : $FOLDER_ID"

      - name: Get Google access token
        id: auth
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl --silent \
              --request POST \
              --data-urlencode "client_id=$GOOGLE_CLIENT_ID" \
              --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" \
              --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN" \
              --data-urlencode "grant_type=refresh_token" \
              "https://oauth2.googleapis.com/token"
          )"

          ACCESS_TOKEN="$(jq -r '.access_token // empty' <<< "$RESPONSE")"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Impossible d'obtenir un access_token"
            echo "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Find latest kernels archive
        id: kernel
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FOLDER_ID: ${{ steps.folder.outputs.folder_id }}
        run: |
          set -euo pipefail

          QUERY="'${FOLDER_ID}' in parents and trashed=false and name contains 'kernels-'"

          RESPONSE="$(
            curl --silent \
              --get \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              --data-urlencode "q=$QUERY" \
              --data-urlencode "orderBy=modifiedTime desc" \
              --data-urlencode "pageSize=100" \
              --data-urlencode "fields=files(id,name,size,modifiedTime)" \
              "https://www.googleapis.com/drive/v3/files"
          )"

          FILE="$(
            jq -c '
              [
                .files[]
                | select(.name | test("^kernels-.*\\.tar\\.xz$"))
              ]
              | sort_by(.modifiedTime)
              | reverse
              | .[0]
            ' <<< "$RESPONSE"
          )"

          if [ "$FILE" = "null" ]; then
            echo "::error::Aucun kernels-*.tar.xz trouvé"
            exit 1
          fi

          FILE_ID="$(jq -r '.id' <<< "$FILE")"
          FILE_NAME="$(jq -r '.name' <<< "$FILE")"
          FILE_SIZE="$(jq -r '.size' <<< "$FILE")"
          FILE_DATE="$(jq -r '.modifiedTime' <<< "$FILE")"

          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

          echo
          echo "Archive sélectionnée :"
          echo "Nom     : $FILE_NAME"
          echo "Taille  : $FILE_SIZE"
          echo "Date    : $FILE_DATE"

      - name: Download latest archive
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FILE_ID: ${{ steps.kernel.outputs.file_id }}
          FILE_NAME: ${{ steps.kernel.outputs.file_name }}
        run: |
          set -euo pipefail

          ARCHIVE="$WORKSPACE/src/$FILE_NAME"

          echo "Archive attendue :"
          echo "$ARCHIVE"

          if [ -f "$ARCHIVE" ] && [ -s "$ARCHIVE" ]; then

            echo
            echo "================================="
            echo "ARCHIVE DEJA PRESENTE"
            echo "================================="
            echo

            ls -lh "$ARCHIVE"
            file "$ARCHIVE"

          else

            echo
            echo "================================="
            echo "TELECHARGEMENT"
            echo "================================="
            echo

            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-delay 5 \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              "https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media" \
              --output "$ARCHIVE"

            echo
            echo "Archive téléchargée :"

            ls -lh "$ARCHIVE"
            file "$ARCHIVE"

          fi

          echo
          echo "=== Archives présentes ==="

          ls -lh "$WORKSPACE/src"

      - name: Cleanup old archives
        shell: bash
        run: |
          find "$WORKSPACE/src" \
            -name 'kernels-*.tar.xz' \
            -mtime +90 \
            -delete || true

          echo "=== Archives conservées ==="
          ls -lh "$WORKSPACE/src"

      - name: Extract kernel sources
        id: extract
        shell: bash
        env:
          FILE_NAME: ${{ steps.kernel.outputs.file_name }}
        run: |
          set -euo pipefail

          echo "=== CLEAN BUILD DIR ==="

          rm -rf "$WORKSPACE/build"/*

          mkdir -p "$WORKSPACE/build"

          echo "=== EXTRACT ==="

          tar -xf \
            "$WORKSPACE/src/$FILE_NAME" \
            -C "$WORKSPACE/build"

          echo "source_dir=$WORKSPACE/build" >> "$GITHUB_OUTPUT"

      - name: Inspect extracted sources
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=== ROOT ==="
          ls -lah "$WORKSPACE/build"

          echo
          echo "=== LEVEL 1 ==="
          find "$WORKSPACE/build" \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%y %p\n' | sort

          echo
          echo "=== LEVEL 2 ==="
          find "$WORKSPACE/build" \
            -mindepth 1 \
            -maxdepth 2 \
            -printf '%y %p\n' | sort | head -250

          echo
          echo "=== SIZE ==="
          du -sh "$WORKSPACE/build"/* 2>/dev/null | sort -h || true

          echo
          echo "=== KERNEL MARKERS ==="

          find "$WORKSPACE/build" \
            -maxdepth 5 \
            \( \
              -name BUILD.bazel \
              -o -name WORKSPACE \
              -o -name MODULE.bazel \
              -o -name build.config \
              -o -name build.config.gki.aarch64 \
              -o -name Makefile \
            \) \
            -print | sort
            
      - name: Detect kernel root
        id: root
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_ROOT="$(
            find "$WORKSPACE/build" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name 'kernel-spacecraft-*' \
              -print \
              -quit
          )"

          if [ -z "$KERNEL_ROOT" ]; then
            echo "::error::Répertoire kernel-spacecraft-* introuvable"
            exit 1
          fi

          if [ ! -d "$KERNEL_ROOT/common/gki" ]; then
            echo "::error::Répertoire common/gki introuvable dans $KERNEL_ROOT"
            exit 1
          fi

          echo "kernel_root=$KERNEL_ROOT" >> "$GITHUB_OUTPUT"
          echo "gki_root=$KERNEL_ROOT/common/gki" >> "$GITHUB_OUTPUT"

          echo "KERNEL_ROOT=$KERNEL_ROOT"
          echo "GKI_ROOT=$KERNEL_ROOT/common/gki"
          
      - name: Detect Android KMI version
        id: kmi
        shell: bash
        env:
          KERNEL_ROOT: ${{ steps.root.outputs.kernel_root }}
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail

          KERNEL_VERSION="$(
            awk '$1 == "VERSION" && $2 == "=" { print $3; exit }' \
              "$GKI_ROOT/Makefile"
          )"

          KERNEL_PATCHLEVEL="$(
            awk '$1 == "PATCHLEVEL" && $2 == "=" { print $3; exit }' \
              "$GKI_ROOT/Makefile"
          )"

          KERNEL_SERIES="${KERNEL_VERSION}.${KERNEL_PATCHLEVEL}"

          echo "=== Version Linux ==="
          echo "$KERNEL_SERIES"

          KMI_STRING="$(
            grep -RhoE \
              'android[0-9]+-[0-9]+\.[0-9]+' \
              "$GKI_ROOT/BUILD.bazel" \
              "$GKI_ROOT/build.config"* \
              "$KERNEL_ROOT/MODULE.bazel" \
              "$KERNEL_ROOT/private/devices/google/spacecraft" \
              2>/dev/null \
            | sort -u \
            | head -n 1 \
            || true
          )"

          if [ -z "$KMI_STRING" ]; then
            echo "::error::Impossible de détecter automatiquement le KMI Android."
            echo "Version Linux détectée : $KERNEL_SERIES"
            exit 1
          fi

          KMI_KERNEL_SERIES="${KMI_STRING#*-}"

          if [ "$KMI_KERNEL_SERIES" != "$KERNEL_SERIES" ]; then
            echo "::error::Incohérence KMI : $KMI_STRING mais Makefile indique $KERNEL_SERIES"
            exit 1
          fi

          SUSFS_BRANCH="gki-${KMI_STRING}-dev"

          echo
          echo "=== KMI détecté ==="
          echo "KMI_STRING=$KMI_STRING"
          echo "SUSFS_BRANCH=$SUSFS_BRANCH"

          echo "kernel_series=$KERNEL_SERIES" >> "$GITHUB_OUTPUT"
          echo "kmi_string=$KMI_STRING" >> "$GITHUB_OUTPUT"
          echo "susfs_branch=$SUSFS_BRANCH" >> "$GITHUB_OUTPUT"

          {
            echo "### KMI détecté"
            echo
            echo "- Linux : \`$KERNEL_SERIES\`"
            echo "- KMI : \`$KMI_STRING\`"
            echo "- Branche SUSFS : \`$SUSFS_BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"
          
      - name: Install KernelSU-Next dev-susfs
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail

          cd "$GKI_ROOT"

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" \
            | bash -s dev-susfs
            
      - name: Verify KernelSU-Next installation
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail

          cd "$GKI_ROOT"

          echo "=== Branche ==="
          git -C KernelSU-Next branch --show-current || true

          echo
          echo "=== Commit ==="
          git -C KernelSU-Next log -1 --oneline || true

          echo
          echo "=== Driver ==="
          ls -lah drivers/kernelsu

          echo
          echo "=== Kconfig ==="
          grep -R "KernelSU" . | head -20 || true

          echo
          echo "=== Installation OK ==="

      - name: Clone matching SUSFS branch
        id: susfs
        shell: bash
        env:
          SUSFS_BRANCH: ${{ steps.kmi.outputs.susfs_branch }}
        run: |
          set -euo pipefail

          SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
          SUSFS_DIR="$WORKSPACE/susfs4ksu"

          echo "=== Branche SUSFS demandée ==="
          echo "$SUSFS_BRANCH"

          if ! git ls-remote \
            --exit-code \
            --heads \
            "$SUSFS_REPO" \
            "refs/heads/$SUSFS_BRANCH" \
            >/dev/null; then

            echo "::error::La branche $SUSFS_BRANCH n'existe pas dans susfs4ksu."
            exit 1
          fi

          rm -rf "$SUSFS_DIR"

          git clone \
            --depth 1 \
            --single-branch \
            --branch "$SUSFS_BRANCH" \
            "$SUSFS_REPO" \
            "$SUSFS_DIR"

          SUSFS_COMMIT="$(
            git -C "$SUSFS_DIR" rev-parse HEAD
          )"

          SUSFS_SUBJECT="$(
            git -C "$SUSFS_DIR" log -1 --format='%s'
          )"

          echo "susfs_dir=$SUSFS_DIR" >> "$GITHUB_OUTPUT"
          echo "susfs_commit=$SUSFS_COMMIT" >> "$GITHUB_OUTPUT"

          echo
          echo "=== SUSFS sélectionné ==="
          echo "Branche : $SUSFS_BRANCH"
          echo "Commit  : $SUSFS_COMMIT"
          echo "Message : $SUSFS_SUBJECT"

          {
            echo "### SUSFS"
            echo
            echo "- Branche : \`$SUSFS_BRANCH\`"
            echo "- Commit : \`$SUSFS_COMMIT\`"
            echo "- Message : \`$SUSFS_SUBJECT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Integrate SUSFS into GKI kernel
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
          SUSFS_DIR: ${{ steps.susfs.outputs.susfs_dir }}
          KERNEL_SERIES: ${{ steps.kmi.outputs.kernel_series }}
          KMI_STRING: ${{ steps.kmi.outputs.kmi_string }}
        run: |
          set -euo pipefail

          KERNEL_PATCH_SOURCE="$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-${KMI_STRING}.patch"
          KERNEL_PATCH_LOCAL="$GKI_ROOT/50_add_susfs_in_gki-${KMI_STRING}.patch"

          echo "=== Paramètres SUSFS ==="
          echo "GKI_ROOT=$GKI_ROOT"
          echo "SUSFS_DIR=$SUSFS_DIR"
          echo "KERNEL_SERIES=$KERNEL_SERIES"
          echo "KERNEL_PATCH_SOURCE=$KERNEL_PATCH_SOURCE"

          echo
          echo "=== Validation des fichiers nécessaires ==="

          test -d "$GKI_ROOT"
          test -d "$GKI_ROOT/fs"
          test -d "$GKI_ROOT/include/linux"
          test -d "$GKI_ROOT/KernelSU-Next"
          test -L "$GKI_ROOT/drivers/kernelsu"

          test -f "$KERNEL_PATCH_SOURCE"
          test -d "$SUSFS_DIR/kernel_patches/fs"
          test -d "$SUSFS_DIR/kernel_patches/include/linux"

          ls -lh "$KERNEL_PATCH_SOURCE"

          echo
          echo "=== Copie du patch kernel ==="

          cp -f \
            "$KERNEL_PATCH_SOURCE" \
            "$KERNEL_PATCH_LOCAL"

          echo
          echo "=== Copie des sources SUSFS dans common/gki ==="

          cp -af \
            "$SUSFS_DIR/kernel_patches/fs/." \
            "$GKI_ROOT/fs/"

          cp -af \
            "$SUSFS_DIR/kernel_patches/include/linux/." \
            "$GKI_ROOT/include/linux/"

          echo
          echo "=== Test préalable du patch kernel ==="
          
          cd "$GKI_ROOT"
          
          if ! patch \
            --dry-run \
            --forward \
            --batch \
            -p1 \
            < "$KERNEL_PATCH_LOCAL"
          then
            echo "Patch SUSFS officiel partiellement compatible avec ce snapshot Spacecraft."
            echo "Les fixups locaux seront appliqués ensuite."
          fi
          
          echo
          echo "=== Application du patch kernel ==="
          
          patch \
            --forward \
            --batch \
            -p1 \
            < "$KERNEL_PATCH_LOCAL" || true

      - name: Apply Spacecraft SUSFS fixups
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail

          cd "$GKI_ROOT"

          patch \
            --forward \
            --batch \
            -p1 \
            < "$GITHUB_WORKSPACE/patches/0001-spacecraft-16238327-susfs-fixups.patch"

          echo "=== Spacecraft fixups appliqués ==="

          echo
          echo "=== Vérification des fichiers copiés ==="

          test -s "$GKI_ROOT/fs/susfs.c"
          test -s "$GKI_ROOT/include/linux/susfs.h"

          ls -lh \
            "$GKI_ROOT/fs/susfs.c" \
            "$GKI_ROOT/include/linux/susfs.h"

          echo
          echo "=== Patch SUSFS kernel appliqué ==="

      - name: Verify SUSFS kernel integration
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
          KERNEL_SERIES: ${{ steps.kmi.outputs.kernel_series }}
          SUSFS_BRANCH: ${{ steps.kmi.outputs.susfs_branch }}
        run: |
          set -euo pipefail

          cd "$GKI_ROOT"

          echo "=== Versions sélectionnées ==="
          echo "Kernel Linux : $KERNEL_SERIES"
          echo "Branche SUSFS : $SUSFS_BRANCH"

          echo
          echo "=== KernelSU-Next ==="

          test -d KernelSU-Next
          test -L drivers/kernelsu

          echo "Branche KernelSU-Next :"
          git -C KernelSU-Next branch --show-current

          echo "Commit KernelSU-Next :"
          git -C KernelSU-Next log -1 --oneline

          echo "Tag KernelSU-Next :"
          git -C KernelSU-Next describe --tags --always

          echo "Lien drivers/kernelsu :"
          ls -lah drivers/kernelsu
          readlink -f drivers/kernelsu

          echo
          echo "=== Fichiers SUSFS ==="

          test -s include/linux/susfs.h
          test -s fs/susfs.c

          ls -lh \
            include/linux/susfs.h \
            fs/susfs.c

          echo
          echo "=== Intégration fs/Makefile ==="

          grep -n -E 'susfs(\.o)?' fs/Makefile

          echo
          echo "=== Intégration fs/Kconfig ==="

          grep -n -E 'SUSFS|susfs' fs/Kconfig || true

          echo
          echo "=== Configuration KernelSU-Next SUSFS ==="

          grep -n -E \
            'config KSU|config KSU_SUSFS|KSU_SUSFS' \
            KernelSU-Next/kernel/Kconfig \
            | head -n 60 || true

          echo
          echo "=== Références SUSFS dans KernelSU-Next ==="

          grep -R -n -m 30 \
            -E 'linux/susfs\.h|CONFIG_KSU_SUSFS' \
            KernelSU-Next/kernel \
            drivers/kernelsu \
            || true

          echo
          echo "=== Vérifications bloquantes ==="

          grep -q -E 'susfs(\.o)?' fs/Makefile
          grep -q 'KSU_SUSFS' KernelSU-Next/kernel/Kconfig
          grep -R -q 'linux/susfs\.h' KernelSU-Next/kernel
          test -s include/linux/susfs.h
          test -s fs/susfs.c

          echo
          echo "=== Intégration SUSFS kernel validée ==="
          
      - name: Build GKI from sources
        shell: bash
        env:
          KERNEL_ROOT: ${{ steps.root.outputs.kernel_root }}
        run: |
          set -euo pipefail

          cd "$KERNEL_ROOT"

          echo "=== Racine Spacecraft ==="
          pwd

          echo
          echo "=== KernelSU-Next ==="
          git -C common/gki/KernelSU-Next branch --show-current
          git -C common/gki/KernelSU-Next log -1 --oneline
          git -C common/gki/KernelSU-Next describe --tags --always

          echo
          echo "=== Compilation GKI depuis les sources ==="

          time tools/bazel build \
            --config=spacecraft \
            --strategy=KernelBuild=local \
            --//build/kernel/kleaf:use_prebuilt_gki=false \
            --//common:kernel_package_use_prebuilt_kernel=false \
            //common/gki:kernel_aarch64
