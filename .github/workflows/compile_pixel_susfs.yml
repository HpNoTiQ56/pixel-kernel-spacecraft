name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      drive_folder_url:
        description: "Lien du dossier Google Drive contenant kernels-*.tar.xz"
        required: true
        type: string
      ota_url:
        description: "URL OTA Google"
        required: true
        type: string
jobs:
  download-and-extract:

    runs-on:
      - self-hosted
      - Linux
      - X64
      - android-worker

    timeout-minutes: 60

    env:
      WORKSPACE: /home/aurelien/workspace

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        
      - name: Verify runner
        shell: bash
        run: |
          set -euo pipefail

          echo "=== HOST ==="
          hostname

          echo "=== USER ==="
          whoami

          echo "=== PWD ==="
          pwd

          mkdir -p "$WORKSPACE/src"
          mkdir -p "$WORKSPACE/build"
          mkdir -p "$WORKSPACE/dist"

          echo
          echo "=== WORKSPACE ==="
          ls -lah "$WORKSPACE"

          echo
          echo "=== DISK ==="
          df -h

      - name: Extract folder ID
        id: folder
        shell: bash
        env:
          DRIVE_FOLDER_URL: ${{ inputs.drive_folder_url }}
        run: |
          set -euo pipefail

          FOLDER_ID="$(
            printf '%s' "$DRIVE_FOLDER_URL" |
            sed -nE 's#.*(/folders/|[?&]id=)([^/?&]+).*#\2#p'
          )"

          if [ -z "$FOLDER_ID" ]; then
            echo "::error::Impossible d'extraire l'ID du dossier Google Drive"
            exit 1
          fi

          echo "folder_id=$FOLDER_ID" >> "$GITHUB_OUTPUT"

          echo "Folder ID : $FOLDER_ID"

      - name: Get Google access token
        id: auth
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl --silent \
              --request POST \
              --data-urlencode "client_id=$GOOGLE_CLIENT_ID" \
              --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" \
              --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN" \
              --data-urlencode "grant_type=refresh_token" \
              "https://oauth2.googleapis.com/token"
          )"

          ACCESS_TOKEN="$(jq -r '.access_token // empty' <<< "$RESPONSE")"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Impossible d'obtenir un access_token"
            echo "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Find latest kernels archive
        id: kernel
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FOLDER_ID: ${{ steps.folder.outputs.folder_id }}
        run: |
          set -euo pipefail

          QUERY="'${FOLDER_ID}' in parents and trashed=false and name contains 'kernels-'"

          RESPONSE="$(
            curl --silent \
              --get \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              --data-urlencode "q=$QUERY" \
              --data-urlencode "orderBy=modifiedTime desc" \
              --data-urlencode "pageSize=100" \
              --data-urlencode "fields=files(id,name,size,modifiedTime)" \
              "https://www.googleapis.com/drive/v3/files"
          )"

          FILE="$(
            jq -c '
              [
                .files[]
                | select(.name | test("^kernels-.*\\.tar\\.xz$"))
              ]
              | sort_by(.modifiedTime)
              | reverse
              | .[0]
            ' <<< "$RESPONSE"
          )"

          if [ "$FILE" = "null" ]; then
            echo "::error::Aucun kernels-*.tar.xz trouvé"
            exit 1
          fi

          FILE_ID="$(jq -r '.id' <<< "$FILE")"
          FILE_NAME="$(jq -r '.name' <<< "$FILE")"
          FILE_SIZE="$(jq -r '.size' <<< "$FILE")"
          FILE_DATE="$(jq -r '.modifiedTime' <<< "$FILE")"

          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

          echo
          echo "Archive sélectionnée :"
          echo "Nom     : $FILE_NAME"
          echo "Taille  : $FILE_SIZE"
          echo "Date    : $FILE_DATE"

      - name: Download latest archive
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FILE_ID: ${{ steps.kernel.outputs.file_id }}
          FILE_NAME: ${{ steps.kernel.outputs.file_name }}
        run: |
          set -euo pipefail

          ARCHIVE="$WORKSPACE/src/$FILE_NAME"

          echo "Archive attendue :"
          echo "$ARCHIVE"

          if [ -f "$ARCHIVE" ] && [ -s "$ARCHIVE" ]; then

            echo
            echo "================================="
            echo "ARCHIVE DEJA PRESENTE"
            echo "================================="
            echo

            ls -lh "$ARCHIVE"
            file "$ARCHIVE"

          else

            echo
            echo "================================="
            echo "TELECHARGEMENT"
            echo "================================="
            echo

            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-delay 5 \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              "https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media" \
              --output "$ARCHIVE"

            echo
            echo "Archive téléchargée :"

            ls -lh "$ARCHIVE"
            file "$ARCHIVE"

          fi

          echo
          echo "=== Archives présentes ==="

          ls -lh "$WORKSPACE/src"

      - name: Cleanup old archives
        shell: bash
        run: |
          find "$WORKSPACE/src" \
            -name 'kernels-*.tar.xz' \
            -mtime +90 \
            -delete || true

          echo "=== Archives conservées ==="
          ls -lh "$WORKSPACE/src"
          
      - name: Install payload-dumper
        shell: bash
        run: |
          set -euo pipefail

          TOOLS_DIR="$WORKSPACE/tools"
          UV_BIN="$TOOLS_DIR/uv"
          PAYLOAD_VENV="$TOOLS_DIR/payload-dumper-venv"

          mkdir -p "$TOOLS_DIR"

          echo "=== Installation de uv autonome ==="

          if [ ! -x "$UV_BIN" ]; then
            UV_INSTALL_DIR="$TOOLS_DIR/uv-install"

            rm -rf "$UV_INSTALL_DIR"
            mkdir -p "$UV_INSTALL_DIR"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              "https://astral.sh/uv/install.sh" \
              --output "$TOOLS_DIR/install-uv.sh"

            env \
              UV_INSTALL_DIR="$UV_INSTALL_DIR" \
              UV_NO_MODIFY_PATH=1 \
              sh "$TOOLS_DIR/install-uv.sh"

            UV_FOUND="$(
              find "$UV_INSTALL_DIR" \
                -type f \
                -name uv \
                -perm -u+x \
                -print \
                -quit
            )"

            if [ -z "$UV_FOUND" ]; then
              echo "::error::Le binaire uv n'a pas été installé."
              find "$UV_INSTALL_DIR" -maxdepth 3 -type f -ls || true
              exit 1
            fi

            cp "$UV_FOUND" "$UV_BIN"
            chmod +x "$UV_BIN"

            rm -f "$TOOLS_DIR/install-uv.sh"
            rm -rf "$UV_INSTALL_DIR"
          fi

          "$UV_BIN" --version

          echo
          echo "=== Création de l'environnement Python isolé ==="

          if [ ! -x "$PAYLOAD_VENV/bin/python" ]; then
            rm -rf "$PAYLOAD_VENV"

            "$UV_BIN" venv \
              --python python3 \
              "$PAYLOAD_VENV"
          fi

          echo
          echo "=== Installation de payload-dumper ==="

          "$UV_BIN" pip install \
            --python "$PAYLOAD_VENV/bin/python" \
            --upgrade \
            "git+https://github.com/5ec1cff/payload-dumper.git"

          echo
          echo "=== Vérification ==="

          test -x "$PAYLOAD_VENV/bin/payload_dumper"

          "$PAYLOAD_VENV/bin/payload_dumper" --help
          
      - name: Install extract-ikconfig
        shell: bash
        run: |
          set -euo pipefail
      
          mkdir -p "$WORKSPACE/tools"
      
          curl -L \
            https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-ikconfig \
            -o "$WORKSPACE/tools/extract-ikconfig"
      
          chmod +x \
            "$WORKSPACE/tools/extract-ikconfig"
      
          head -5 \
            "$WORKSPACE/tools/extract-ikconfig"
      
      - name: Extract boot image from OTA
        id: ota
        shell: bash
        env:
          OTA_URL: ${{ inputs.ota_url }}
        run: |
          set -euo pipefail

          PAYLOAD_DUMPER="$WORKSPACE/tools/payload-dumper-venv/bin/payload_dumper"
          BOOT_OUTPUT_DIR="$WORKSPACE/ota"

          if [ ! -x "$PAYLOAD_DUMPER" ]; then
            echo "::error::payload_dumper n'est pas installé : $PAYLOAD_DUMPER"
            exit 1
          fi

          case "$OTA_URL" in
            http://*|https://*)
              ;;
            *)
              echo "::error::URL OTA invalide : $OTA_URL"
              exit 1
              ;;
          esac

          rm -rf "$BOOT_OUTPUT_DIR"
          mkdir -p "$BOOT_OUTPUT_DIR"

          cd "$BOOT_OUTPUT_DIR"

          echo "=== Extraction de boot depuis l'OTA distante ==="
          echo "OTA : $OTA_URL"

          "$PAYLOAD_DUMPER" \
            --partitions boot \
            "$OTA_URL"

          BOOT_IMG="$BOOT_OUTPUT_DIR/output/boot.img"
          
          if [ ! -s "$BOOT_IMG" ]; then
            echo "::error::boot.img n'a pas été extrait dans $BOOT_OUTPUT_DIR"
            find "$BOOT_OUTPUT_DIR" \
              -maxdepth 3 \
              -type f \
              -ls \
              || true
            exit 1
          fi

          echo "boot_img=$BOOT_IMG" >> "$GITHUB_OUTPUT"

          echo
          echo "=== Boot stock extrait ==="

          ls -lh "$BOOT_IMG"
          file "$BOOT_IMG"
          
      - name: Install MagiskBoot
        shell: bash
        run: |
          set -euo pipefail
      
          mkdir -p "$WORKSPACE/tools"
      
          if [ ! -x "$WORKSPACE/tools/magiskboot" ]; then
      
            cd "$WORKSPACE/tools"
      
            curl -L \
              https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk \
              -o magisk.apk
      
            unzip -o -j \
              magisk.apk \
              "lib/x86_64/libmagiskboot.so" \
              -d .
      
            mv libmagiskboot.so magiskboot
      
            chmod +x magiskboot
          fi
      
          test -x "$WORKSPACE/tools/magiskboot"
      
          echo "MagiskBoot installé"
          
      - name: Extract stock kernel metadata
        id: stockkernel
        shell: bash
        env:
          BOOT_IMG: ${{ steps.ota.outputs.boot_img }}
        run: |
          set -euo pipefail

          test -s "$BOOT_IMG"

          FULL_VERSION="$(
            strings "$BOOT_IMG" \
              | grep -a -m1 'Linux version'
          )"

          RELEASE_SUFFIX="$(
            printf '%s\n' "$FULL_VERSION" \
              | grep -aoE -- '-android[^ )]+'
          )"

          PREEMPT_LINE="$(
            strings "$BOOT_IMG" \
              | grep -a -m1 '^#1 SMP PREEMPT '
          )"

          BUILD_TIMESTAMP="$(
            printf '%s\n' "$PREEMPT_LINE" \
              | sed 's/^#1 SMP PREEMPT //'
          )"

          SOURCE_DATE_EPOCH="$(
            date \
              --utc \
              --date="$BUILD_TIMESTAMP" \
              +%s
          )"

          if [ -z "$RELEASE_SUFFIX" ]; then
            echo "::error::Suffixe kernel stock introuvable"
            echo "FULL_VERSION=$FULL_VERSION"
            exit 1
          fi

          if [ -z "$BUILD_TIMESTAMP" ]; then
            echo "::error::Timestamp kernel stock introuvable"
            exit 1
          fi

          case "$BUILD_TIMESTAMP" in
            *" 1970")
              echo "::error::Le timestamp stock extrait vaut déjà 1970"
              exit 1
              ;;
          esac

          {
            echo "release_suffix=$RELEASE_SUFFIX"
            echo "build_timestamp=$BUILD_TIMESTAMP"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
          } >> "$GITHUB_OUTPUT"

          echo "FULL_VERSION=$FULL_VERSION"
          echo "RELEASE_SUFFIX=$RELEASE_SUFFIX"
          echo "PREEMPT_LINE=$PREEMPT_LINE"
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          

      - name: Extract kernel sources
        id: extract
        shell: bash
        env:
          FILE_NAME: ${{ steps.kernel.outputs.file_name }}
        run: |
          set -euo pipefail

          echo "=== CLEAN BUILD DIR ==="

          rm -rf "$WORKSPACE/build"/*

          mkdir -p "$WORKSPACE/build"

          echo "=== EXTRACT ==="

          tar -xf \
            "$WORKSPACE/src/$FILE_NAME" \
            -C "$WORKSPACE/build"

          echo "source_dir=$WORKSPACE/build" >> "$GITHUB_OUTPUT"
    
      - name: Inspect extracted sources
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=== ROOT ==="
          ls -lah "$WORKSPACE/build"

          echo
          echo "=== LEVEL 1 ==="
          find "$WORKSPACE/build" \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%y %p\n' | sort

          echo
          echo "=== LEVEL 2 ==="
          find "$WORKSPACE/build" \
            -mindepth 1 \
            -maxdepth 2 \
            -printf '%y %p\n' | sort | head -250

          echo
          echo "=== SIZE ==="
          du -sh "$WORKSPACE/build"/* 2>/dev/null | sort -h || true

          echo
          echo "=== KERNEL MARKERS ==="

          find "$WORKSPACE/build" \
            -maxdepth 5 \
            \( \
              -name BUILD.bazel \
              -o -name WORKSPACE \
              -o -name MODULE.bazel \
              -o -name build.config \
              -o -name build.config.gki.aarch64 \
              -o -name Makefile \
            \) \
            -print | sort
            
      - name: Detect kernel root
        id: root
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_ROOT="$(
            find "$WORKSPACE/build" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name 'kernel-spacecraft-*' \
              -print \
              -quit
          )"

          if [ -z "$KERNEL_ROOT" ]; then
            echo "::error::Répertoire kernel-spacecraft-* introuvable"
            exit 1
          fi

          if [ ! -d "$KERNEL_ROOT/common/gki" ]; then
            echo "::error::Répertoire common/gki introuvable dans $KERNEL_ROOT"
            exit 1
          fi

          echo "kernel_root=$KERNEL_ROOT" >> "$GITHUB_OUTPUT"
          echo "gki_root=$KERNEL_ROOT/common/gki" >> "$GITHUB_OUTPUT"

          echo "KERNEL_ROOT=$KERNEL_ROOT"
          echo "GKI_ROOT=$KERNEL_ROOT/common/gki"
          
      - name: Detect Android KMI version
        id: kmi
        shell: bash
        env:
          KERNEL_ROOT: ${{ steps.root.outputs.kernel_root }}
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
        run: |
          set -euo pipefail

          KERNEL_VERSION="$(
            awk '$1 == "VERSION" && $2 == "=" { print $3; exit }' \
              "$GKI_ROOT/Makefile"
          )"

          KERNEL_PATCHLEVEL="$(
            awk '$1 == "PATCHLEVEL" && $2 == "=" { print $3; exit }' \
              "$GKI_ROOT/Makefile"
          )"

          KERNEL_SERIES="${KERNEL_VERSION}.${KERNEL_PATCHLEVEL}"

          echo "=== Version Linux ==="
          echo "$KERNEL_SERIES"

          KMI_STRING="$(
            grep -RhoE \
              'android[0-9]+-[0-9]+\.[0-9]+' \
              "$GKI_ROOT/BUILD.bazel" \
              "$GKI_ROOT/build.config"* \
              "$KERNEL_ROOT/MODULE.bazel" \
              "$KERNEL_ROOT/private/devices/google/spacecraft" \
              2>/dev/null \
            | sort -u \
            | head -n 1 \
            || true
          )"

          if [ -z "$KMI_STRING" ]; then
            echo "::error::Impossible de détecter automatiquement le KMI Android."
            echo "Version Linux détectée : $KERNEL_SERIES"
            exit 1
          fi

          KMI_KERNEL_SERIES="${KMI_STRING#*-}"

          if [ "$KMI_KERNEL_SERIES" != "$KERNEL_SERIES" ]; then
            echo "::error::Incohérence KMI : $KMI_STRING mais Makefile indique $KERNEL_SERIES"
            exit 1
          fi

          SUSFS_BRANCH="gki-${KMI_STRING}-dev"

          echo
          echo "=== KMI détecté ==="
          echo "KMI_STRING=$KMI_STRING"
          echo "SUSFS_BRANCH=$SUSFS_BRANCH"

          echo "kernel_series=$KERNEL_SERIES" >> "$GITHUB_OUTPUT"
          echo "kmi_string=$KMI_STRING" >> "$GITHUB_OUTPUT"
          echo "susfs_branch=$SUSFS_BRANCH" >> "$GITHUB_OUTPUT"

          {
            echo "### KMI détecté"
            echo
            echo "- Linux : \`$KERNEL_SERIES\`"
            echo "- KMI : \`$KMI_STRING\`"
            echo "- Branche SUSFS : \`$SUSFS_BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Spoof kernel metadata
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
          RELEASE_SUFFIX: ${{ steps.stockkernel.outputs.release_suffix }}
        run: |
          set -euo pipefail

          cd "$GKI_ROOT"

          # Suppression du -dirty
          sed -i \
            "s/printf '%s' -dirty/printf '%s' ''/g" \
            scripts/setlocalversion

          # Remplacement du dernier echo
          sed -i \
            "s#echo \"\${KERNELVERSION}\${file_localversion}\${config_localversion}\${LOCALVERSION}\${scm_version}\"#echo \"\${KERNELVERSION}${RELEASE_SUFFIX}\"#" \
            scripts/setlocalversion
            
      - name: Inject stock kernel build timestamp
        shell: bash
        env:
          GKI_ROOT: ${{ steps.root.outputs.gki_root }}
          BUILD_TIMESTAMP: ${{ steps.stockkernel.outputs.build_timestamp }}
        run: |
          set -euo pipefail

          INIT_MAKEFILE="$GKI_ROOT/init/Makefile"
          TEMP_MAKEFILE="$INIT_MAKEFILE.tmp"

          test -s "$INIT_MAKEFILE"

          if [ -z "$BUILD_TIMESTAMP" ]; then
            echo "::error::BUILD_TIMESTAMP est vide"
            exit 1
          fi

          echo "=== Timestamp stock ==="
          printf '<%s>\n' "$BUILD_TIMESTAMP"

          echo
          echo "=== Avant modification ==="

          grep -nF \
            'build-timestamp = $(or $(KBUILD_BUILD_TIMESTAMP), $(build-timestamp-auto))' \
            "$INIT_MAKEFILE"

          awk \
            -v timestamp="$BUILD_TIMESTAMP" \
            '
              $0 == "build-timestamp = $(or $(KBUILD_BUILD_TIMESTAMP), $(build-timestamp-auto))" {
                print "build-timestamp = \"" timestamp "\""
                replaced++
                next
              }

              {
                print
              }

              END {
                if (replaced != 1) {
                  print "Nombre de lignes remplacées incorrect : " replaced > "/dev/stderr"
                  exit 42
                }
              }
            ' \
            "$INIT_MAKEFILE" \
            > "$TEMP_MAKEFILE"

          mv "$TEMP_MAKEFILE" "$INIT_MAKEFILE"

          echo
          echo "=== Après modification ==="

          grep -nF \
            'build-timestamp =' \
            "$INIT_MAKEFILE"

          EXPECTED_LINE="build-timestamp = \"$BUILD_TIMESTAMP\""

          if ! grep -Fqx \
            -- "$EXPECTED_LINE" \
            "$INIT_MAKEFILE"
          then
            echo "::error::Le timestamp stock n'a pas été injecté"
            exit 1
          fi

          echo
          echo "Timestamp stock injecté correctement."

